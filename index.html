<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCL 开荒复盘入口</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
<main class="mx-auto max-w-5xl px-6 py-10">
    <header class="mb-8 border-b border-gray-800 pb-5">
        <div class="text-xs font-semibold uppercase tracking-wide text-amber-300">Mythic Analyzer</div>
        <h1 class="mt-2 text-3xl font-bold text-white">WCL 开荒复盘入口</h1>
        <p class="mt-2 text-sm text-gray-400">选择数据来源，进入对应的分析流程。</p>
    </header>

    <section class="grid gap-4 md:grid-cols-3">
        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-blue-500 hover:bg-gray-900/80"
           href="/report">
            <div class="text-xs font-semibold uppercase tracking-wide text-blue-300">Local JSON</div>
            <h2 class="mt-2 text-xl font-bold">JSON 导入 / 自动读取</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">读取本地复盘 JSON，或手动上传已经生成好的团队战斗复盘结果。</p>
        </a>

        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-emerald-500 hover:bg-gray-900/80"
           href="/online">
            <div class="text-xs font-semibold uppercase tracking-wide text-emerald-300">Online WCL</div>
            <h2 class="mt-2 text-xl font-bold">选择 Boss 并在线获取</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">通过版本、副本、Boss 和专属配置启动本地分析任务，完成后进入复盘面板。</p>
        </a>

        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-violet-500 hover:bg-gray-900/80"
           href="/mythic-dungeon">
            <div class="text-xs font-semibold uppercase tracking-wide text-violet-300">Mythic+</div>
            <h2 class="mt-2 text-xl font-bold">大秘境抄轴工具</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">读取固定大秘境施法 JSON，按副本、Boss、玩家和药水波次生成时间轴。</p>
        </a>
    </section>
</main>
</body>
</html>
