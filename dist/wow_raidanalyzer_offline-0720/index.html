<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCL 开荒复盘入口</title>
    <script src="assets/vendor/tailwindcss.js"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
<main class="mx-auto max-w-5xl px-6 py-10">
    <header class="mb-8 border-b border-gray-800 pb-5">
        <div class="text-xs font-semibold uppercase tracking-wide text-amber-300">Mythic Analyzer</div>
        <h1 class="mt-2 text-3xl font-bold text-white">WCL 开荒复盘入口</h1>
        <p class="mt-2 text-sm text-gray-400">场面分析与智商记事本分离。把分析结果丢进 <code class="text-amber-200">data/</code>，分析页读场面；记事本只管跨日扣分与申诉。</p>
    </header>

    <section class="grid gap-4 md:grid-cols-3">
        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-blue-500 hover:bg-gray-900/80"
           href="report.html">
            <div class="text-xs font-semibold uppercase tracking-wide text-blue-300">分析</div>
            <h2 class="mt-2 text-xl font-bold">场面复盘 / 开庭</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">读取分析 JSON，查看灭团复盘、转阶段与开庭明细。不负责跨日计分留痕。</p>
        </a>

        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-fuchsia-500 hover:bg-gray-900/80"
           href="scoreboard.html">
            <div class="text-xs font-semibold uppercase tracking-wide text-fuchsia-300">智商记事本</div>
            <h2 class="mt-2 text-xl font-bold">开荒智商日记</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">按开荒日期翻页，同步开庭判定，支持申诉留痕与追加扣分，并汇总多日成绩。</p>
        </a>

        <a class="block rounded border border-gray-800 bg-gray-900 p-6 hover:border-emerald-500 hover:bg-gray-900/80"
           href="online.html">
            <div class="text-xs font-semibold uppercase tracking-wide text-emerald-300">在线（本机开发）</div>
            <h2 class="mt-2 text-xl font-bold">选择 Boss 并拉取 WCL</h2>
            <p class="mt-3 text-sm leading-6 text-gray-400">需要 Python + WCL 凭据。最终用户离线包通常只用场面分析 + 智商记事本。</p>
        </a>
    </section>
</main>
</body>
</html>
