<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终审判决历史</title>
    <style>
        :root { color-scheme: dark; --bg:#030712; --panel:#111827; --line:#374151; --muted:#9ca3af; --accent:#d946ef; --amber:#fbbf24; --green:#34d399; --red:#f87171; }
        * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:#e5e7eb; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
        button,input,textarea,select { font:inherit; color:inherit; } button { cursor:pointer; } a { color:#93c5fd; text-decoration:none; }
        .app { max-width:1280px; margin:auto; padding:24px; } .panel { background:var(--panel); border:1px solid #1f2937; border-radius:12px; overflow:hidden; margin-bottom:18px; }
        .head { padding:18px 20px; border-bottom:1px solid #4a044e; background:rgba(74,4,78,.28); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        h1,h2,h3,p { margin:0; } h1 { color:#f5d0fe; font-size:26px; } h2 { font-size:18px; } .muted { color:var(--muted); font-size:12px; margin-top:5px; }
        .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .btn { border:1px solid #6b7280; background:#111827; border-radius:7px; padding:7px 12px; }
        .btn:hover { background:#1f2937; } .primary { border-color:#c026d3; background:#86198f; font-weight:700; } .green { border-color:#059669; background:#065f46; }
        .date { min-width:130px; text-align:center; font-weight:800; color:#f0abfc; } .content { padding:18px; } .import-grid { display:grid; grid-template-columns:1fr auto; gap:12px; }
        textarea,input,select { background:#030712; border:1px solid var(--line); border-radius:7px; padding:8px; } textarea { width:100%; min-height:90px; resize:vertical; }
        table { width:100%; border-collapse:collapse; } th,td { padding:11px 12px; border-top:1px solid #1f2937; vertical-align:top; } th { color:var(--muted); font-size:12px; background:#030712; text-align:left; }
        .num { width:72px; text-align:center; } .iq { color:#f0abfc; font-weight:900; font-variant-numeric:tabular-nums; } .count { color:var(--amber); font-weight:800; }
        .appeal { color:var(--green); } .breakdown { display:flex; flex-wrap:wrap; gap:6px; } .chip { border:1px solid #4b5563; background:#030712; border-radius:999px; padding:2px 7px; font-size:11px; }
        .note { min-height:54px; } .empty { padding:55px; text-align:center; color:#6b7280; } .status { min-height:22px; color:#86efac; font-size:12px; }
        .danger { color:#fca5a5; } .rank { color:#6b7280; text-align:center; width:55px; } .player { color:#93c5fd; font-weight:800; white-space:nowrap; }
        @media(max-width:800px){ .app{padding:12px}.import-grid{grid-template-columns:1fr}.table-wrap{overflow-x:auto} table{min-width:920px} }
    </style>
</head>
<body>
<div class="app">
    <section class="panel">
        <div class="head">
            <div><h1>终审判决历史</h1><p class="muted">独立终审模块。支持日期翻页、同日叠加、申诉备注，以及 verdicts/verdict-日期.json 导入导出。</p></div>
            <div class="row"><a class="btn" href="report.html">返回主报告</a><button class="btn" id="exportBtn">导出 verdict_data.json</button></div>
        </div>
        <div class="content row" style="justify-content:center">
            <button class="btn" id="prevBtn">← 上一天</button><div class="date" id="dateLabel">暂无数据</div><button class="btn" id="nextBtn">下一天 →</button>
            <input type="date" id="datePicker"><button class="btn" id="newDayBtn">新建当天</button>
        </div>
    </section>

    <section class="panel">
        <div class="head"><div><h2>导入判决</h2><p class="muted">可粘贴主报告 JSON、终审配置 JSON、单日对象或玩家数组。</p></div><div class="row"><select id="importMode"><option value="stack">同日叠加</option><option value="replace">同日覆盖</option></select><label class="btn">选择 JSON<input id="fileInput" type="file" accept=".json" hidden></label></div></div>
        <div class="content"><div class="import-grid"><textarea id="importText" placeholder="粘贴 JSON / 导入字符串"></textarea><button class="btn primary" id="importBtn">导入</button></div><div class="status" id="status"></div></div>
    </section>

    <section class="panel">
        <div class="head"><div><h2>当日终审</h2><p class="muted" id="dayMeta">确认后会重新排序并保存到浏览器；导出配置文件可跨设备持久化。</p></div><button class="btn green" id="saveBtn">确认申诉并重新排序</button></div>
        <div class="table-wrap"><table><thead><tr><th class="rank">排行</th><th>玩家</th><th>识别次数</th><th>申诉无罪</th><th>智商损失</th><th>申诉项统计</th><th style="min-width:240px">申诉备注</th></tr></thead><tbody id="verdictBody"></tbody></table><div class="empty" id="empty">当前日期暂无判决数据，请从主报告确认或在上方导入。</div></div>
    </section>
</div>
<script src="./assets/vendor/wcl_hardcore_api.js"></script>
<script>
(() => {
    const STORAGE_KEY = 'wowRaidFinalVerdictHistory';
    const emptyStore = () => ({ schemaVersion: 1, days: [] });
    let store = emptyStore(); let dayIndex = -1;
    const $ = id => document.getElementById(id);
    const today = () => new Date().toISOString().slice(0,10);
    const safeNumber = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const normalizePlayer = row => ({
        name: String(row?.name || '').trim(), roles: Array.isArray(row?.roles) ? row.roles : [],
        recognitionCount: safeNumber(row?.recognitionCount), appealAcquittalCount: safeNumber(row?.appealAcquittalCount),
        penaltyUnits: safeNumber(row?.penaltyUnits ?? row?.recognitionCount), iqLoss: safeNumber(row?.iqLoss),
        scoreMultiplier: safeNumber(row?.scoreMultiplier || 1), appealUnitMultiplier: safeNumber(row?.appealUnitMultiplier || row?.scoreMultiplier || 1),
        breakdown: row?.breakdown && typeof row.breakdown === 'object' ? {...row.breakdown} : {}, note: String(row?.note || row?.appealNote || '')
    });
    function normalizeDay(day, fallbackDate=today()) {
        return { date: String(day?.date || fallbackDate).slice(0,10), sourceReports: day?.sourceReports || day?.reportIDs || [], pointsPerCount: safeNumber(day?.pointsPerCount || 10) || 10,
            updatedAt: day?.updatedAt || new Date().toISOString(), players: (day?.players || day?.verdict || []).map(normalizePlayer).filter(row => row.name) };
    }
    function parsePayload(payload) {
        if (payload?.data?.page4_finalVerdict) {
            const fights = payload.data.page1_wipeAnalysis || [];
            const date = fights.find(row => row.date)?.date || today();
            return [normalizeDay({date, sourceReports:payload.meta?.analyzedReports || [], pointsPerCount:payload.meta?.courtConfig?.verdictPointsPerCount || 10, players:payload.data.page4_finalVerdict})];
        }
        if (Array.isArray(payload)) return [normalizeDay({date:today(), players:payload})];
        if (Array.isArray(payload?.days)) return payload.days.map(day => normalizeDay(day));
        if (payload?.players || payload?.verdict) return [normalizeDay(payload)];
        throw new Error('无法识别的终审 JSON 格式');
    }
    function stackDay(base, incoming) {
        const map = new Map(base.players.map(row => [row.name, {...row, breakdown:{...row.breakdown}}]));
        incoming.players.forEach(row => {
            const target = map.get(row.name);
            if (!target) { map.set(row.name, {...row, breakdown:{...row.breakdown}}); return; }
            target.recognitionCount += row.recognitionCount; target.appealAcquittalCount += row.appealAcquittalCount; target.penaltyUnits += row.penaltyUnits;
            Object.entries(row.breakdown).forEach(([key,value]) => target.breakdown[key] = safeNumber(target.breakdown[key]) + safeNumber(value));
            if (row.note && !target.note.includes(row.note)) target.note = [target.note,row.note].filter(Boolean).join('；');
        });
        return {...base, sourceReports:[...new Set([...(base.sourceReports||[]),...(incoming.sourceReports||[])])], updatedAt:new Date().toISOString(), players:[...map.values()]};
    }
    function mergeDays(days, mode) {
        days.forEach(day => { const index=store.days.findIndex(row=>row.date===day.date); if(index<0) store.days.push(day); else store.days[index]=mode==='stack'?stackDay(store.days[index],day):day; });
        store.days.sort((a,b)=>a.date.localeCompare(b.date)); dayIndex=Math.max(0,store.days.findIndex(row=>row.date===days[days.length-1].date)); persist(); render();
    }
    function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    function recalc(day){ day.players.forEach(row=>{ row.appealAcquittalCount=Math.max(0,Math.min(row.recognitionCount,row.appealAcquittalCount)); const units=Math.max(0,row.penaltyUnits-row.appealAcquittalCount*(row.appealUnitMultiplier||1)); row.iqLoss=Math.round(units*day.pointsPerCount); }); day.players.sort((a,b)=>b.iqLoss-a.iqLoss||b.recognitionCount-a.recognitionCount||a.name.localeCompare(b.name)); day.updatedAt=new Date().toISOString(); }
    function render(){ const day=store.days[dayIndex]; $('dateLabel').textContent=day?.date||'暂无数据'; $('datePicker').value=day?.date||today(); $('dayMeta').textContent=day?`来源日志：${(day.sourceReports||[]).join('、')||'手动导入'} · 更新时间：${day.updatedAt||'-'}`:'当前没有数据'; $('empty').style.display=day?.players?.length?'none':'block'; $('verdictBody').innerHTML=''; if(!day)return;
        day.players.forEach((row,index)=>{ const tr=document.createElement('tr'); const chips=Object.entries(row.breakdown||{}).filter(([,v])=>safeNumber(v)>0).map(([k,v])=>`<span class="chip">${escapeHtml(k)} ${safeNumber(v)}次</span>`).join(''); tr.innerHTML=`<td class="rank">${index+1}</td><td class="player">${escapeHtml(row.name)}</td><td><input class="num recognition" type="number" min="0" value="${row.recognitionCount}"></td><td><input class="num acquittal appeal" type="number" min="0" value="${row.appealAcquittalCount}"></td><td class="iq">${row.iqLoss}</td><td><div class="breakdown">${chips||'<span class="muted">无</span>'}</div></td><td><textarea class="note" placeholder="填写申诉备注">${escapeHtml(row.note)}</textarea></td>`; tr.querySelector('.recognition').oninput=e=>row.recognitionCount=Math.max(0,safeNumber(e.target.value)); tr.querySelector('.acquittal').oninput=e=>row.appealAcquittalCount=Math.max(0,safeNumber(e.target.value)); tr.querySelector('.note').oninput=e=>row.note=e.target.value; $('verdictBody').appendChild(tr); }); }
    function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    async function importText(text){ const payload=JSON.parse(text); const days=parsePayload(payload); mergeDays(days,$('importMode').value); $('status').textContent=`已导入 ${days.length} 个日期。`; }
    $('importBtn').onclick=()=>importText($('importText').value).catch(error=>{$('status').textContent=error.message;$('status').className='status danger';});
    $('fileInput').onchange=async e=>{ const file=e.target.files[0]; if(file) await importText(await file.text()).catch(error=>{$('status').textContent=error.message;}); };
    $('prevBtn').onclick=()=>{if(dayIndex>0){dayIndex--;render();}}; $('nextBtn').onclick=()=>{if(dayIndex<store.days.length-1){dayIndex++;render();}};
    $('datePicker').onchange=e=>{const index=store.days.findIndex(row=>row.date===e.target.value);if(index>=0){dayIndex=index;render();}};
    $('newDayBtn').onclick=()=>{const date=$('datePicker').value||today();mergeDays([normalizeDay({date,players:[]})],'replace');};
    $('saveBtn').onclick=()=>{const day=store.days[dayIndex];if(!day)return;recalc(day);persist();render();$('status').textContent=`${day.date} 已保存并重新排序。`;};
    $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='verdict_data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
    async function init(){
        try{store=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||emptyStore();}catch{store=emptyStore();}
        if(!store.days?.length){
            if(window.__VERDICT_DATA__){
                store={...emptyStore(),...window.__VERDICT_DATA__};
            }else{
                try{const response=await fetch('./verdict_data.json');if(response.ok)store={...emptyStore(),...await response.json()};}catch{}
            }
        }
        store.days=(store.days||[]).map(day=>normalizeDay(day)).sort((a,b)=>a.date.localeCompare(b.date));
        dayIndex=store.days.length-1;render();
    }
    init();
})();
</script>
</body>
</html>
