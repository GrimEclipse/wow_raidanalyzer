# wow.wuwoapp.com 的 wowhead 中转缓存区（2026-08-14 新增）
# 用途：国内用户不挂 VPN 也能加载 wowhead 图标/技能数据；服务器(美国)回源，本地缓存。
# 静态资源（图标图片/JS）：长缓存
proxy_cache_path /var/cache/nginx/wow_static levels=1:2 keys_zone=wow_static:64m max_size=2g inactive=90d use_temp_path=off;
# Tooltip API（技能/物品数据）：短缓存
proxy_cache_path /var/cache/nginx/wow_api levels=1:2 keys_zone=wow_api:32m max_size=500m inactive=14d use_temp_path=off;
