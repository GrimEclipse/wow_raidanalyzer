server {
    listen 80;
    listen [::]:80;
    server_name wow.wuwoapp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl;
    server_name wow.wuwoapp.com;

    ssl_certificate /etc/letsencrypt/live/wow-wuwo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wow-wuwo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/wow.wuwoapp.com.access.log;
    error_log /var/log/nginx/wow.wuwoapp.com.error.log;

    client_max_body_size 64m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 2026-07-31：nginx Basic Auth 已按用户要求移除。
    # 鉴权改由应用自身承担（analyzer_core/auth_store.py，session cookie wra_session，
    # 未登录访问一律 303 → /login）。若需临时恢复，取消下面两行注释即可，
    # htpasswd 文件仍保留在 /etc/nginx/.wow_htpasswd。
    # auth_basic "wow raid analyzer";
    # auth_basic_user_file /etc/nginx/.wow_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 2026-08-14：wowhead 中转（国内用户免 VPN 看图标）。
    # /zamimg/*          -> https://wow.zamimg.com/*    （tooltips.js + 图标图片，长缓存）
    # /wowhead-tooltip/* -> https://www.wowhead.com/*   （tooltip 数据 API，短缓存）
    # 前端 assets/vendor/wow-tooltips.js 已本地化，STATIC_URL 与 tooltip API 均指向本站这两个路径。
    location /zamimg/ {
        proxy_pass https://wow.zamimg.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host wow.zamimg.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache wow_static;
        proxy_cache_valid 200 30d;
        proxy_cache_key $host$uri;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 30d;
        proxy_read_timeout 30s;
        # 2026-08-14：universal.css 里 url(/images/...) 是绝对路径，
        # 经本站加载后会解析到本站根 → 404 → tooltip 无背景遮罩。
        # 改写为 /zamimg/images/... 走中转（wow.zamimg.com/images/ 存在）。
        sub_filter_types text/css;
        sub_filter 'url(/images/' 'url(/zamimg/images/';
        sub_filter 'url("/images/' 'url("/zamimg/images/';
        sub_filter "url('/images/" "url('/zamimg/images/";
        sub_filter_once off;
    }

    location /wowhead-tooltip/ {
        proxy_pass https://nether.wowhead.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host nether.wowhead.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache wow_api;
        proxy_cache_valid 200 24h;
        proxy_cache_key $host$uri$is_args$args;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_read_timeout 30s;
    }

    # 分析任务进度是 SSE 长连接，必须关掉缓冲
    location ~ ^/api/jobs/.+/events$ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}
