<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>场地推演演示</title>
  <link rel="stylesheet" href="/frontend/core/design-system.css">
  <style>
    body{margin:0}.demo-shell{max-width:1500px;margin:auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px}
    h1{margin:5px 0;font-size:30px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
    .choices button{font:inherit;padding:10px 15px;border:1px solid #364961;border-radius:10px;color:#c7d8ec;background:#122138;cursor:pointer}
    .choices button.active{border-color:#8bc5d4;background:#203c50}
    iframe{display:block;width:100%;height:760px;border:1px solid #32465e;border-radius:16px;background:#101a2c}
    .hint{color:#94a9c1;font-size:13px;line-height:1.8}
    @media(max-width:700px){.demo-shell{padding:12px}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body class="cosmic-page">
  <main class="demo-shell">
    <header>
      <div><h1>场地推演演示</h1><p class="hint">选择首领，播放战斗场景。</p></div>
      <a href="/" class="cosmic-button">返回首页</a>
    </header>
    <nav class="choices" id="choices" aria-label="演示首领"></nav>
    <p id="source" class="hint" role="status"></p>
    <iframe id="preview" title="场地推演"></iframe>
  </main>
  <script>
    const params=new URLSearchParams(location.search),buttons=document.getElementById('choices'),preview=document.getElementById('preview'),source=document.getElementById('source');
    let sizeObserver;
    preview.addEventListener('load',()=>{
      sizeObserver?.disconnect();
      const doc=preview.contentDocument,content=doc?.querySelector('main');if(!content)return;
      const resize=()=>{const view=preview.contentWindow,height=Math.ceil(content.getBoundingClientRect().bottom+view.scrollY+parseFloat(view.getComputedStyle(doc.body).paddingBottom||0));if(height>0)preview.style.height=`${height}px`;};
      sizeObserver=new ResizeObserver(resize);sizeObserver.observe(content);resize();
    });
    fetch('/assets/demos/manifest.json').then(r=>{
      if(!r.ok)throw Error('演示暂时不可用。');return r.json();
    }).then(data=>{
      const allDemos=data.demos||[],demos=allDemos.filter(d=>d.homepageVisible!==false);
      function open(d){
        const url=d.page+'?'+new URLSearchParams({json:d.json,tab:d.tab,embed:'1'});
        if(params.get('embed')==='1'){location.replace(url);return;}
        preview.src=url;source.textContent=d.description;
        buttons.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',demos[i]===d));
        history.replaceState(null,'','/demos?boss='+encodeURIComponent(d.key));
      }
      for(const d of demos){const b=document.createElement('button');b.type='button';b.textContent=d.label;b.onclick=()=>open(d);buttons.appendChild(b);}
      const selected=allDemos.find(d=>d.key===params.get('boss'))||demos[0];
      if(selected)open(selected);else throw Error('演示暂时不可用。');
    }).catch(error=>{source.textContent=error.message;preview.hidden=true;});
  </script>
</body>
</html>
