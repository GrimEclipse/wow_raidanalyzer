<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>团队技能时间线</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <style>
        body{background:
            radial-gradient(circle at 12% 8%,rgba(34,211,238,.12),transparent 28rem),
            radial-gradient(circle at 88% 16%,rgba(168,85,247,.11),transparent 30rem),#020617}
        .phase-chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid rgba(103,232,249,.18);border-radius:999px;background:rgba(8,47,73,.45);padding:.3rem .65rem;color:#a5f3fc;font-size:.72rem}
        .phase-chip::before{content:"";width:.38rem;height:.38rem;border-radius:50%;background:#22d3ee;box-shadow:0 0 12px #22d3ee}
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto max-w-7xl px-5 py-5">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-3 border-b border-slate-800 pb-3">
        <div>
            <a href="index.html" class="text-xs font-semibold text-cyan-300 hover:text-cyan-200">← 返回功能首页</a>
            <h1 class="mt-1 text-2xl font-bold">团队技能时间线</h1>
            <p class="mt-1 max-w-3xl text-sm leading-6 text-slate-400">按版本、首领和治疗构成查找过本记录，直接生成 MRT、NSRT 与表格结果。</p>
        </div>
        <button id="demo" class="rounded border border-fuchsia-700/70 bg-fuchsia-950/35 px-4 py-2 text-xs font-semibold text-fuchsia-200 hover:border-fuchsia-400 hover:text-white">查看分阶段示例</button>
    </header>

    <section class="rounded-xl border border-slate-800 bg-slate-900/70 p-5 shadow-2xl shadow-black/20">
        <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-6">
            <label class="text-sm text-slate-300">版本
                <select id="version" class="mt-2 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-white"></select>
            </label>
            <label class="text-sm text-slate-300">副本
                <select id="raid" class="mt-2 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-white"></select>
            </label>
            <label class="text-sm text-slate-300">首领
                <select id="boss" class="mt-2 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-white"></select>
            </label>
            <label class="text-sm text-slate-300">难度
                <select id="difficulty" class="mt-2 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-white"></select>
            </label>
            <label class="text-sm text-slate-300">治疗人数
                <input id="healer-count" type="number" min="1" max="10" value="4"
                       class="mt-2 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-white">
            </label>
            <button id="search" class="self-end rounded bg-cyan-500 px-5 py-2 font-semibold text-slate-950 hover:bg-cyan-400 disabled:cursor-wait disabled:opacity-60">
                查找公开过本记录
            </button>
        </div>
        <div class="mt-5">
            <div class="text-sm font-medium text-slate-300">治疗构成（指定包含）</div>
            <div id="healer-slots" class="mt-2 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
        </div>
    </section>

    <div id="status" class="mt-5 hidden rounded border px-4 py-3 text-sm"></div>
    <section id="results" class="mt-6 space-y-6"></section>
</main>

<template id="result-template">
    <article class="overflow-hidden rounded-xl border border-slate-800 bg-slate-900">
        <div class="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 px-5 py-4">
            <div>
                <div class="result-title text-lg font-bold"></div>
                <div class="result-meta mt-1 text-xs text-slate-400"></div>
                <div class="result-healers mt-3 flex flex-wrap gap-2"></div>
                <div class="result-phases mt-3 flex flex-wrap gap-2"></div>
            </div>
            <a class="result-wcl rounded border border-slate-700 px-3 py-2 text-xs text-cyan-300 hover:border-cyan-500" target="_blank" rel="noreferrer">打开 WCL</a>
        </div>
        <div class="grid xl:grid-cols-[minmax(0,1.45fr)_minmax(22rem,0.55fr)]">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[720px] text-left text-sm">
                    <thead class="bg-slate-950/60 text-xs uppercase tracking-wide text-slate-500">
                    <tr><th class="px-4 py-3">全场 / 阶段</th><th class="px-4 py-3">玩家</th><th class="px-4 py-3">专精</th><th class="px-4 py-3">技能</th><th class="px-4 py-3">类别</th></tr>
                    </thead>
                    <tbody class="result-timeline divide-y divide-slate-800"></tbody>
                </table>
            </div>
            <div class="border-t border-slate-800 bg-slate-950/35 p-4 xl:border-l xl:border-t-0">
                <div class="flex gap-2">
                    <button data-export="mrt" class="rounded bg-amber-400 px-3 py-2 text-xs font-semibold text-slate-950 hover:bg-amber-300">复制 MRT</button>
                    <button data-export="nsrt" class="rounded bg-fuchsia-400 px-3 py-2 text-xs font-semibold text-slate-950 hover:bg-fuchsia-300">复制 NSRT 导入串</button>
                    <button data-export="tsv" class="rounded border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-200 hover:border-slate-500">复制 TSV</button>
                </div>
                <pre class="result-export mt-3 max-h-[34rem] overflow-auto whitespace-pre-wrap rounded border border-slate-800 bg-slate-950 p-3 text-xs leading-6 text-slate-400"></pre>
            </div>
        </div>
    </article>
</template>

<script>
(() => {
    const state = { options: null, results: [] };
    const el = id => document.getElementById(id);
    const version = el('version');
    const raid = el('raid');
    const boss = el('boss');
    const difficulty = el('difficulty');
    const healerCount = el('healer-count');
    const healerSlots = el('healer-slots');
    const status = el('status');
    const results = el('results');
    const searchButton = el('search');
    const serviceHelp = '抄轴工具需要 Python 服务访问 WCL。请运行 start_app.bat，然后打开 http://127.0.0.1:8765/cooldowns；如果服务已经开着，请重启一次以加载新接口。';

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const clock = ms => {
        const seconds = Math.floor(Math.max(0, Number(ms) || 0) / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    };
    const showStatus = (message, kind = 'info') => {
        status.className = `mt-5 rounded border px-4 py-3 text-sm ${
            kind === 'error' ? 'border-red-800 bg-red-950/50 text-red-200' :
            kind === 'ok' ? 'border-emerald-800 bg-emerald-950/40 text-emerald-200' :
            'border-cyan-800 bg-cyan-950/40 text-cyan-200'
        }`;
        status.textContent = message;
    };
    const currentRaid = () => state.options.raids.find(row => row.key === raid.value);
    const renderRaids = () => {
        const rows = state.options.raids.filter(row => !row.version || row.version === version.value);
        raid.innerHTML = rows.map(row => `<option value="${escapeHtml(row.key)}">${escapeHtml(row.name)}</option>`).join('');
        renderBosses();
    };
    const renderBosses = () => {
        boss.innerHTML = (currentRaid()?.bosses || []).map(row =>
            `<option value="${escapeHtml(row.key)}">${escapeHtml(row.name)}</option>`
        ).join('');
    };
    const renderSlots = () => {
        const count = Math.max(1, Math.min(10, Number(healerCount.value) || 1));
        const old = [...healerSlots.querySelectorAll('select')].map(node => node.value);
        healerSlots.innerHTML = Array.from({ length: count }, (_, index) => `
            <label class="text-xs text-slate-400">治疗槽位 ${index + 1}
                <select class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
                    <option value="">不限专精</option>
                    ${state.options.healerSpecs.map(row => `<option value="${row.key}">${escapeHtml(row.label)}</option>`).join('')}
                </select>
            </label>
        `).join('');
        [...healerSlots.querySelectorAll('select')].forEach((node, index) => {
            node.value = old[index] || '';
        });
    };
    const renderMatch = (match, index) => {
        const fragment = el('result-template').content.cloneNode(true);
        const article = fragment.querySelector('article');
        article.querySelector('.result-title').textContent = `样本 ${index + 1} · ${match.fightName}`;
        article.querySelector('.result-meta').textContent =
            `${clock(match.durationMs)} · ${match.reportID} / 战斗 ${match.fightID} · ${match.timeline.length} 次团队技能 · ${
                ({wcl:'WCL 实际阶段',ptr_reference:'PTR 实测阶段',ptr_reference_scaled:'PTR 参考阶段（按战斗时长校准）',single_phase:'单阶段'})[match.phases?.source] || '阶段待确认'
            }`;
        article.querySelector('.result-wcl').href = match.wclUrl;
        article.querySelector('.result-healers').innerHTML = match.healers.map(row =>
            `<span class="rounded-full border border-cyan-900 bg-cyan-950/50 px-3 py-1 text-xs text-cyan-200">${escapeHtml(row.name)} · ${escapeHtml(row.specLabel)}</span>`
        ).join('');
        article.querySelector('.result-phases').innerHTML = (match.phases?.segments || []).map(row =>
            `<span class="phase-chip">${escapeHtml(row.phaseLabel)} · ${escapeHtml(row.phaseName)} · ${clock(row.startTimeMs)}</span>`
        ).join('');
        article.querySelector('.result-timeline').innerHTML = match.timeline.length
            ? match.timeline.map(row => `
                <tr class="hover:bg-slate-800/45">
                    <td class="px-4 py-3"><div class="font-mono text-cyan-300">${clock(row.timeMs)}</div><div class="mt-1 text-[11px] text-fuchsia-300">${escapeHtml(row.phaseLabel || 'P1')} +${clock(row.phaseTimeMs ?? row.timeMs)}</div></td>
                    <td class="px-4 py-3 font-medium text-white">${escapeHtml(row.player)}</td>
                    <td class="px-4 py-3 text-slate-400">${escapeHtml(row.specLabel || '—')}</td>
                    <td class="px-4 py-3"><span class="text-slate-200">${escapeHtml(row.spell)}</span> <span class="ml-1 font-mono text-xs text-slate-600">${row.spellID}</span></td>
                    <td class="px-4 py-3 text-slate-400">${escapeHtml(row.categoryLabel)}</td>
                </tr>
            `).join('')
            : '<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">本场没有检测到已配置的团队技能。</td></tr>';
        const preview = article.querySelector('.result-export');
        preview.textContent = match.exports.mrt;
        article.querySelector('[data-export="mrt"]').addEventListener('click', async event => {
            await navigator.clipboard.writeText(match.exports.mrt);
            preview.textContent = match.exports.mrt;
            event.currentTarget.textContent = '已复制 MRT';
        });
        article.querySelector('[data-export="nsrt"]').addEventListener('click', async event => {
            await navigator.clipboard.writeText(match.exports.nsrt);
            preview.textContent = match.exports.nsrt;
            event.currentTarget.textContent = '已复制 NSRT';
        });
        article.querySelector('[data-export="tsv"]').addEventListener('click', async event => {
            await navigator.clipboard.writeText(match.exports.timestampTsv);
            preview.textContent = match.exports.timestampTsv;
            event.currentTarget.textContent = '已复制 TSV';
        });
        return fragment;
    };
    const renderDemo = () => {
        const timeline = [
            {timeMs:30000,phaseIndex:1,phaseLabel:'P1',phaseName:'第一阶段',phaseTimeMs:30000,player:'云岚',specLabel:'戒律 牧师',spell:'真言术：障',spellID:62618,categoryLabel:'团队减伤'},
            {timeMs:118000,phaseIndex:2,phaseLabel:'P1.5',phaseName:'转阶段',phaseTimeMs:5000,player:'星野',specLabel:'恢复 萨满祭司',spell:'灵魂链接图腾',spellID:98008,categoryLabel:'团队减伤'},
            {timeMs:151000,phaseIndex:3,phaseLabel:'P2',phaseName:'第二阶段',phaseTimeMs:12000,player:'月白',specLabel:'神圣 圣骑士',spell:'光环掌握',spellID:31821,categoryLabel:'团队减伤'},
            {timeMs:224000,phaseIndex:3,phaseLabel:'P2',phaseName:'第二阶段',phaseTimeMs:85000,player:'青禾',specLabel:'恢复 德鲁伊',spell:'宁静',spellID:740,categoryLabel:'治疗大技能'},
        ];
        const sample = {
            fightName:'宇宙之冕 · 阶段化导出演示',reportID:'LOCAL-DEMO',fightID:1,durationMs:260000,wclUrl:'#',
            healers:[{name:'云岚',specLabel:'戒律 牧师'},{name:'星野',specLabel:'恢复 萨满祭司'},{name:'月白',specLabel:'神圣 圣骑士'},{name:'青禾',specLabel:'恢复 德鲁伊'}],
            phases:{source:'wcl',confidence:'exact',segments:[
                {phaseIndex:1,phaseLabel:'P1',phaseName:'第一阶段',startTimeMs:0},
                {phaseIndex:2,phaseLabel:'P1.5',phaseName:'转阶段',startTimeMs:113000},
                {phaseIndex:3,phaseLabel:'P2',phaseName:'第二阶段',startTimeMs:139000},
            ]},
            timeline,
            exports:{
                mrt:"[P1] 第一阶段\n{time:00:30} {spell:62618} 云岚 - 真言术：障\n\n[P1.5] 转阶段\n{time:01:58} {spell:98008} 星野 - 灵魂链接图腾\n\n[P2] 第二阶段\n{time:02:31} {spell:31821} 月白 - 光环掌握\n{time:03:44} {spell:740} 青禾 - 宁静",
                nsrt:"EncounterID:3181;Difficulty:Mythic;Name:Crown of the Cosmos;\ntime:30;ph:1;tag:云岚;spellid:62618;\ntime:5;ph:2;tag:星野;spellid:98008;\ntime:12;ph:3;tag:月白;spellid:31821;\ntime:85;ph:3;tag:青禾;spellid:740;",
                timestampTsv:"全场时间\t阶段\t阶段内时间\t玩家\t技能\n00:30\tP1\t00:30\t云岚\t真言术：障\n01:58\tP1.5\t00:05\t星野\t灵魂链接图腾\n02:31\tP2\t00:12\t月白\t光环掌握\n03:44\tP2\t01:25\t青禾\t宁静",
            },
        };
        results.innerHTML = '';
        results.appendChild(renderMatch(sample, 0));
        const link = results.querySelector('.result-wcl');
        link.textContent = '纯本地示例';
        link.removeAttribute('href');
        showStatus('已载入本地阶段示例：NSRT 使用阶段内相对时间与 ph 编号；MRT 按阶段分组并保留全场绝对时间。', 'ok');
    };
    const runSearch = async () => {
        const button = el('search');
        button.disabled = true;
        button.textContent = '正在匹配阵容与读取技能记录…';
        results.innerHTML = '';
        showStatus('正在读取公开过本记录并核对治疗构成。首次查询可能需要几十秒，后续会命中缓存。');
        try {
            const response = await fetch('/api/raid-cooldowns/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    raid: raid.value,
                    boss: boss.value,
                    difficulty: Number(difficulty.value),
                    healerCount: Number(healerCount.value),
                    healerSpecs: [...healerSlots.querySelectorAll('select')].map(node => node.value).filter(Boolean),
                }),
            });
            const payload = await response.json();
            if (!response.ok || payload.error) throw new Error(payload.error || `HTTP ${response.status}`);
            showStatus(payload.message, payload.status === 'ok' ? 'ok' : 'info');
            state.results = payload.matches || [];
            state.results.forEach((match, index) => results.appendChild(renderMatch(match, index)));
        } catch (error) {
            const message = error instanceof TypeError && /fetch/i.test(error.message)
                ? serviceHelp
                : (error.message || String(error));
            showStatus(message, 'error');
        } finally {
            button.disabled = false;
            button.textContent = '查找公开过本记录';
        }
    };

    if (location.protocol === 'file:') {
        searchButton.disabled = true;
        searchButton.textContent = '请先启动本地服务';
        showStatus(serviceHelp, 'error');
        return;
    }

    fetch('/api/raid-cooldowns/options')
        .then(response => response.json())
        .then(options => {
            state.options = options;
            const versions = options.versions || [...new Set(options.raids.map(row => row.version).filter(Boolean))].map(key => ({key, label:key}));
            version.innerHTML = versions.map(row => `<option value="${escapeHtml(row.key)}">${escapeHtml(row.label)}</option>`).join('');
            difficulty.innerHTML = options.difficulties.map(row => `<option value="${row.value}">${escapeHtml(row.label)}</option>`).join('');
            difficulty.value = '4';
            renderRaids();
            renderSlots();
        })
        .catch(() => {
            searchButton.disabled = true;
            searchButton.textContent = '服务未就绪';
            showStatus(serviceHelp, 'error');
        });
    version.addEventListener('change', renderRaids);
    raid.addEventListener('change', renderBosses);
    healerCount.addEventListener('change', renderSlots);
    el('search').addEventListener('click', runSearch);
    el('demo').addEventListener('click', renderDemo);
})();
</script>
</body>
</html>
