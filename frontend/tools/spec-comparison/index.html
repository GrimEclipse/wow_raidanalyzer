<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>单场专精对标</title>
  <style>
    :root{--bg:#101311;--panel:#171b18;--panel2:#1d221e;--line:#303730;--text:#f4f6f2;--muted:#a8b0a8;--ours:#c9edff;--ours-strong:#74cdf4;--ours-ink:#123b4c;--peer:#ffe4bd;--peer-strong:#ffbf69;--peer-ink:#553312;--good:#b9e47a;--warn:#ff9c8e;--gold:#f6d77d;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% -10%,#26352a 0,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,"Microsoft YaHei",system-ui,sans-serif}a{color:inherit}button,select{font:inherit}.shell{width:min(1500px,calc(100% - 36px));margin:auto;padding:34px 0 80px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--good);font-weight:800}.top h1{font-size:clamp(30px,4vw,54px);line-height:1.05;margin:6px 0}.top p{margin:0;color:var(--muted);font-size:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid var(--line);background:#202620;color:var(--text);padding:10px 15px;border-radius:11px;cursor:pointer;text-decoration:none}.button.primary{background:var(--good);border-color:var(--good);color:#20310d;font-weight:800}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.player-card{border-radius:16px;padding:18px 20px;color:#172019;display:flex;justify-content:space-between;gap:20px;align-items:center}.player-card.ours{background:var(--ours)}.player-card.peer{background:var(--peer)}.player-role{font-size:11px;letter-spacing:.12em;font-weight:900;opacity:.64}.player-name{font-size:22px;font-weight:950}.player-meta{opacity:.72}.player-card .button{background:rgba(255,255,255,.62);border-color:rgba(0,0,0,.09);color:inherit}.section{background:linear-gradient(180deg,var(--panel),#151815);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.16)}.section-head{padding:19px 22px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:0;color:var(--muted);font-size:12px}.section-body{padding:20px 22px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side{border-radius:15px;padding:18px;color:#172019}.side.ours{background:var(--ours)}.side.peer{background:var(--peer)}.side-label{font-size:11px;letter-spacing:.1em;font-weight:900;opacity:.62}.side h3{margin:2px 0 9px;font-size:21px}.side strong.big{display:block;font-size:34px;line-height:1.1}.side p{margin:7px 0 0}.summary-conclusion{margin-top:14px;padding:15px 17px;border:1px solid #506047;background:#222a22;border-radius:13px;font-size:15px}.summary-conclusion strong{color:var(--good)}.ability{display:flex;align-items:center;gap:10px;min-width:0}.spell-link{display:inline-flex;text-decoration:none;border-radius:9px}.spell-icon{width:38px;height:38px;border-radius:8px;border:1px solid #59615a;object-fit:cover;background:#202520}.ability-name{font-weight:800}.ability-sub{font-size:11px;color:var(--muted)}.coverage{width:100%;border-collapse:collapse}.coverage th{padding:0 10px 12px;color:var(--muted);font-size:11px;text-align:left}.coverage td{padding:9px 10px;border-top:1px solid #292f2a}.coverage th:not(:first-child),.coverage td:not(:first-child){width:39%}.measure{display:grid;grid-template-columns:58px 1fr 62px;gap:9px;align-items:center}.percent{font-weight:900;text-align:right}.bar{height:10px;background:#292f2a;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:inherit}.measure.ours .bar>i{background:linear-gradient(90deg,var(--ours-strong),#b9e7f7)}.measure.peer .bar>i{background:linear-gradient(90deg,var(--peer-strong),#ffe2ae)}.count{font-size:11px;color:var(--muted);white-space:nowrap}.ledger{border:1px solid var(--line);border-radius:15px;padding:17px;background:var(--panel2)}.ledger-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.legend-chip{padding:5px 9px;border-radius:999px;color:#152017;font-size:11px;font-weight:900}.legend-chip.ours{background:var(--ours)}.legend-chip.peer{background:var(--peer)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#242a25;border-radius:11px;padding:12px}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}.metric.waste b{color:var(--warn)}.source-list{margin-top:13px}.source-row{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 80px;align-items:center;gap:10px;padding:7px 0}.source-row .bar{height:8px}.mini-bars{display:grid;gap:9px}.mini-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr 50px;gap:10px;align-items:center}.infusion-top{display:flex;gap:24px;align-items:flex-end;margin-bottom:17px}.infusion-top b{font-size:31px}.infusion-top span{color:var(--muted);font-size:11px}.sequence-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sequence-title{display:flex;align-items:center;gap:8px;font-weight:900}.dot{width:11px;height:11px;border-radius:50%}.dot.ours{background:var(--ours-strong)}.dot.peer{background:var(--peer-strong)}select{background:#252b26;color:var(--text);border:1px solid var(--line);padding:8px 11px;border-radius:9px}.track-wrap{overflow-x:auto;padding-bottom:8px}.track{position:relative;display:flex;gap:30px;align-items:flex-start;min-width:max-content;padding:25px 26px 16px}.track:before{content:"";position:absolute;left:30px;right:30px;top:48px;height:9px;border-radius:99px;background:#3b413c}.cast-node{position:relative;width:54px;text-align:center;z-index:1}.cast-node .spell-icon{width:48px;height:48px;border-radius:7px;box-shadow:0 4px 13px #000}.cast-time{font-size:10px;color:var(--muted);margin-top:5px}.cast-badge{position:absolute;right:-8px;top:-10px;background:#f7e79c;color:#3e330b;font-size:9px;font-weight:900;border-radius:8px;padding:2px 5px;white-space:nowrap}.cast-name{max-width:70px;margin-left:-8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sequence-block+.sequence-block{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.comparison{width:100%;border-collapse:collapse}.comparison th,.comparison td{padding:11px 12px;border-top:1px solid #292f2a;text-align:center}.comparison th:first-child,.comparison td:first-child{text-align:left}.comparison thead th{border-top:0;color:var(--muted);font-size:11px}.ours-text{color:#aaddf4}.peer-text{color:#ffd59c}.delta.pos{color:var(--ours-strong)}.delta.neg{color:var(--peer-strong)}.skill-card{border:1px solid var(--line);border-radius:15px;overflow:hidden}.skill-card+.skill-card{margin-top:13px}.skill-title{padding:14px 16px;background:#202621;display:flex;align-items:center;justify-content:space-between}.skill-title h3{margin:0}.skill-sides{display:grid;grid-template-columns:1fr 1fr}.skill-side{padding:16px}.skill-side:first-child{border-right:1px solid var(--line)}.skill-side-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.times{display:flex;flex-wrap:wrap;gap:6px}.time-chip{background:#2a312b;border:1px solid #3a443b;border-radius:8px;padding:4px 7px;font-size:11px}.toll-table{width:100%;border-collapse:collapse;margin-top:12px}.toll-table th,.toll-table td{padding:8px;border-top:1px solid #303630;text-align:center;font-size:12px}.toll-table th{color:var(--muted);font-size:10px}.danger{color:var(--warn);font-weight:900}.continuity-card{border-radius:15px;padding:18px;color:#172019}.continuity-card.ours{background:var(--ours)}.continuity-card.peer{background:var(--peer)}.continuity-main{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.continuity-main div{background:rgba(255,255,255,.54);border-radius:10px;padding:11px}.continuity-main b{display:block;font-size:25px}.continuity-main span{font-size:11px;opacity:.68}.gap-list{display:flex;gap:7px;flex-wrap:wrap}.gap-list span{background:rgba(255,255,255,.55);padding:4px 7px;border-radius:8px;font-size:11px}.empty{color:var(--muted);padding:18px;text-align:center}.error{margin-top:18px;padding:16px;background:#4c2424;border:1px solid #8b4b4b;border-radius:12px}.loading{padding:80px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.players,.two,.skill-sides{grid-template-columns:1fr}.skill-side:first-child{border-right:0;border-bottom:1px solid var(--line)}.metric-grid{grid-template-columns:repeat(2,1fr)}.coverage th:not(:first-child),.coverage td:not(:first-child){width:auto}.measure{grid-template-columns:48px minmax(80px,1fr)}.measure .count{grid-column:2}.shell{width:min(100% - 20px,1500px)}.section-body{padding:15px}.coverage .ability-sub{display:none}}
    @media print{body{background:#fff;color:#111}.shell{width:100%;padding:0}.actions{display:none}.section,.ledger,.skill-card{box-shadow:none;background:#fff;border-color:#bbb}.section-head p,.ability-sub,.count,.cast-time{color:#555}.section{break-inside:avoid}.track-wrap{overflow:visible}.track{flex-wrap:wrap}.player-card,.side,.continuity-card{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
  <style>
    .section-head p{display:none}
    .player-card,.player-card.ours,.player-card.peer{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
    .player-card.ours{border-left:3px solid var(--ours-strong)}
    .player-card.peer{border-left:3px solid var(--peer-strong)}
    .player-card.ours .player-name,.side.ours h3,.continuity-card.ours h3{color:var(--ours-strong)}
    .player-card.peer .player-name,.side.peer h3,.continuity-card.peer h3{color:var(--peer-strong)}
    .player-card .button{background:#252b26;border-color:var(--line);color:var(--text)}
    .side,.side.ours,.side.peer{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .side.ours{border-left:3px solid var(--ours-strong)}
    .side.peer{border-left:3px solid var(--peer-strong)}
    .legend-chip.ours{background:#202a2e;border:1px solid #315266;color:var(--ours-strong)}
    .legend-chip.peer{background:#2c2820;border:1px solid #5e492d;color:var(--peer-strong)}
    .continuity-card,.continuity-card.ours,.continuity-card.peer{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .continuity-card.ours{border-left:3px solid var(--ours-strong)}
    .continuity-card.peer{border-left:3px solid var(--peer-strong)}
    .continuity-main div,.gap-list span{background:#252b26}
    .start-stats{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 22px;margin-top:14px}
    .start-stats h2{font-size:16px;margin:0 0 13px}
    .stats-table{width:100%;border-collapse:collapse}
    .stats-table th,.stats-table td{padding:9px 12px;border-top:1px solid #292f2a;text-align:center}
    .stats-table thead th{border-top:0;color:var(--muted);font-size:11px}
    .stats-table th:first-child,.stats-table td:first-child{text-align:left}
    .stat-name.ours{color:var(--ours-strong)}.stat-name.peer{color:var(--peer-strong)}
    @media(max-width:650px){.stats-table th,.stats-table td{padding:8px 5px}.stats-table .stat-rating{font-size:0}.stats-table .stat-rating:after{content:"评分";font-size:10px;color:var(--muted)}}
  </style>
  <script>const whTooltips={colorLinks:false,iconizeLinks:false,renameLinks:false};</script>

<body>
<main class="shell">
  <header class="top">
    <div><div class="eyebrow">单场战斗 · 单专精复盘</div><h1>神圣圣骑士对标分析</h1><p id="subtitle">正在读取战斗数据……</p></div>
    <div class="actions"><button class="button primary" id="downloadHtml">保存独立网页</button><button class="button" onclick="window.print()">打印 / 保存 PDF</button></div>
  </header>
  <div id="app" class="loading">正在整理施法、增益与圣能数据……</div>
</main>
<script id="embedded-data" type="application/json">{}</script>
<script>
  let documentData=null;
  const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  const fmt=ms=>{const s=Math.max(0,Math.round((ms||0)/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
  const number=value=>Number(value||0).toLocaleString("zh-CN");
  const iconUrl=icon=>icon?`https://wow.zamimg.com/images/wow/icons/large/${String(icon).replace(/\.jpg$/i,"")}.jpg`:"";
  function spell(row){const img=iconUrl(row.icon);const visual=img?`<img class="spell-icon" src="${esc(img)}" alt="${esc(row.name)}">`:"";return `<a class="spell-link" href="https://www.wowhead.com/cn/spell=${Number(row.abilityId)||0}" data-wowhead="domain=cn&amp;dd=15" target="_blank" rel="noopener" aria-label="在 Wowhead 查看${esc(row.name)}">${visual}</a>`}
  function playerCard(player,kind,label){return `<article class="player-card ${kind}"><div><div class="player-role">${label}</div><div class="player-name">${esc(player.identity.playerName)}</div><div class="player-meta">战斗 ${fmt(player.durationMs)} · ${esc(player.identity.reportTitle||"")}</div></div><a class="button" href="${esc(player.identity.reportUrl)}" target="_blank" rel="noopener">查看原始记录</a></article>`}
  function startingStats(p,b){const fields=[["itemLevel","平均装等",false],["criticalStrike","暴击",true],["haste","急速",true],["mastery","精通",true],["versatility","全能",true]];return `<section class="start-stats"><h2>开战属性对比</h2><table class="stats-table"><thead><tr><th>属性</th><th class="stat-name ours">${esc(p.identity.playerName)}</th><th class="stat-name peer">${esc(b.identity.playerName)}</th><th>主玩家差值</th></tr></thead><tbody>${fields.map(([key,label,rating])=>{const a=p.combatantStats?.[key],q=b.combatantStats?.[key],delta=a==null||q==null?null:Number(a)-Number(q);return `<tr><td>${label}${rating?` <span class="stat-rating">（评分）</span>`:""}</td><td>${a==null?"—":number(a)}</td><td>${q==null?"—":number(q)}</td><td class="delta ${delta>=0?"pos":"neg"}">${delta==null?"—":`${delta>0?"+":""}${number(Math.round(delta*10)/10)}`}</td></tr>`}).join("")}</tbody></table></section>`}
  function summary(d,p,b){const pc=id=>p.casts.find(x=>x.abilityId===id)||{};const bc=id=>b.casts.find(x=>x.abilityId===id)||{};const flash=Number(bc(19750).windowCount||0)-Number(pc(19750).windowCount||0);const judge=Number(pc(275773).windowCount||0)-Number(bc(275773).windowCount||0);const totalJudge=Number(pc(275773).count||0)-Number(bc(275773).count||0);return `<section class="section"><div class="section-head"><h2>1. 综述</h2><p>先看两边的覆盖与资源取向，再看差距来源</p></div><div class="section-body"><div class="two"><article class="side ours"><div class="side-label">主玩家 · ${esc(p.identity.playerName)}</div><h3>更多审判，灌注去向更分散</h3><strong class="big">+${number(Math.max(0,judge))} 次审判</strong><p>美德窗口内相对对标玩家；总审判差为 <b>${totalJudge>0?"+":""}${number(totalJudge)}</b>。</p><p>圣能溢出 <b>${p.resourceLedger.waste}（${p.resourceLedger.wastePerMinute}/min）</b>，灌注可用 ${p.infusion.charges} 层。</p></article><article class="side peer"><div class="side-label">对标玩家 · ${esc(b.identity.playerName)}</div><h3>美德窗口更偏向读条圣闪</h3><strong class="big">+${number(Math.max(0,flash))} 次圣光闪现</strong><p>美德窗口内相对主玩家；灌注主要分配给圣光闪现。</p><p>圣能溢出 <b>${b.resourceLedger.waste}（${b.resourceLedger.wastePerMinute}/min）</b>，灌注可用 ${b.infusion.charges} 层。</p></article></div><div class="summary-conclusion"><strong>差距判断：</strong>两边灌注触发规模接近，主要区别是灌注去向与窗口内的填充优先级；主玩家以审判为主，对标玩家把更多公共冷却交给圣光闪现。</div></div></section>`}
  function coverage(p,b){const ignored=new Set([431381,431522]);const primaryBuffs=p.buffCoverage.filter(x=>!ignored.has(x.abilityId));const bm=new Map(b.buffCoverage.filter(x=>!ignored.has(x.abilityId)).map(x=>[x.abilityId,x]));const rows=primaryBuffs.map(a=>{const q=bm.get(a.abilityId)||{};return `<tr><td><div class="ability">${spell(a)}<div><div class="ability-name">${esc(a.name)}</div><div class="ability-sub">增益覆盖</div></div></div></td><td><div class="measure ours"><span class="percent">${a.uptimePercent}%</span><span class="bar"><i style="width:${Math.min(100,a.uptimePercent)}%"></i></span><span class="count">${a.applications} 次获得</span></div></td><td><div class="measure peer"><span class="percent">${q.uptimePercent||0}%</span><span class="bar"><i style="width:${Math.min(100,q.uptimePercent||0)}%"></i></span><span class="count">${q.applications||0} 次获得</span></div></td></tr>`}).join("");return `<section class="section"><div class="section-head"><h2>2. 增益覆盖对比</h2></div><div class="section-body"><table class="coverage"><thead><tr><th>增益</th><th class="ours-text">${esc(p.identity.playerName)}</th><th class="peer-text">${esc(b.identity.playerName)}</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
  function ledger(player,kind){const max=Math.max(1,...player.resourceLedger.gainSources.map(x=>x.actual+x.waste));return `<article class="ledger"><div class="ledger-head"><h3>${esc(player.identity.playerName)}</h3><span class="legend-chip ${kind}">${kind==="ours"?"主玩家":"对标玩家"}</span></div><div class="metric-grid"><div class="metric"><b>${number(player.resourceLedger.nominalGained)}</b><span>理论获得</span></div><div class="metric"><b>${number(player.resourceLedger.actualGained)}</b><span>实际获得</span></div><div class="metric"><b>${number(player.resourceLedger.spent)}</b><span>实际消耗</span></div><div class="metric waste"><b>${number(player.resourceLedger.waste)}（${player.resourceLedger.wastePerMinute}/min）</b><span>总溢出（每分钟）</span></div></div><div class="source-list">${player.resourceLedger.gainSources.map(x=>`<div class="source-row"><div class="ability">${spell(x)}<span>${esc(x.name)}</span></div><span class="bar"><i style="width:${(x.actual+x.waste)/max*100}%;background:${kind==="ours"?"var(--ours-strong)":"var(--peer-strong)"}"></i></span><span>${x.actual} / <b class="danger">${x.waste}</b></span></div>`).join("")}</div></article>`}
  function resources(p,b){return `<section class="section"><div class="section-head"><h2>3. 资源总账和溢出</h2><p>来源行末依次为实际获得 / 溢出</p></div><div class="section-body two">${ledger(p,"ours")}${ledger(b,"peer")}</div></section>`}
  function infusionCard(player,kind){const max=Math.max(1,...player.infusion.destinations.map(x=>x.count));return `<article class="ledger"><div class="ledger-head"><h3>${esc(player.identity.playerName)}</h3><span class="legend-chip ${kind}">${kind==="ours"?"主玩家":"对标玩家"}</span></div><div class="infusion-top"><div><b>${player.infusion.charges}</b><br><span>可用层数</span></div><div><b>${player.infusion.consumed}</b><br><span>已分配</span></div><div><b>${player.infusion.expiredOrUnmatched}</b><br><span>未匹配</span></div></div><div class="mini-bars">${player.infusion.destinations.map(x=>`<div class="mini-row"><div class="ability">${spell(x)}<span>${esc(x.name)}</span></div><span class="bar"><i style="width:${x.count/max*100}%;background:${kind==="ours"?"var(--ours-strong)":"var(--peer-strong)"}"></i></span><b>${x.count}</b></div>`).join("")}</div></article>`}
  function infusion(p,b){return `<section class="section"><div class="section-head"><h2>4. 圣光灌注分配</h2><p>按最终消耗灌注的技能归类</p></div><div class="section-body two">${infusionCard(p,"ours")}${infusionCard(b,"peer")}</div></section>`}
  function castNode(row){const badge=[];if(row.infusionStacks)badge.push(`灌注 ${row.infusionStacks}`);if(row.holyPower!==undefined)badge.push(`圣能 ${row.holyPower}`);return `<div class="cast-node">${badge.length?`<span class="cast-badge">${badge.join(" · ")}</span>`:""}${spell(row)}<div class="cast-time">+${(row.offsetMs/1000).toFixed(1)}秒</div><div class="cast-name">${esc(row.name)}</div></div>`}
  function sequenceBlock(player,kind,id){const options=player.windows.map(w=>`<option value="${w.index-1}">第 ${w.index} 个窗口 · ${fmt(w.startMs)}</option>`).join("");return `<div class="sequence-block"><div class="sequence-tools"><div class="sequence-title"><span class="dot ${kind}"></span>${esc(player.identity.playerName)}</div><select id="${id}">${options}</select></div><div class="track-wrap"><div class="track" id="${id}-track"></div></div></div>`}
  function sequences(p,b){return `<section class="section"><div class="section-head"><h2>5. 爆发区间施法序列</h2><p>从美德道标施放后开始，显示后续 9 秒</p></div><div class="section-body">${sequenceBlock(p,"ours","primaryWindow")}${sequenceBlock(b,"peer","benchmarkWindow")}</div></section>`}
  function aggregate(p,b){const ids=[20473,19750,82326,156322,85222,275773,375576];const ps=new Map(p.casts.map(x=>[x.abilityId,x])),bs=new Map(b.casts.map(x=>[x.abilityId,x]));return `<section class="section"><div class="section-head"><h2>6. 窗口内施法总对比</h2><p>统计所有美德道标窗口内的成功施法</p></div><div class="section-body"><table class="comparison"><thead><tr><th>技能</th><th class="ours-text">${esc(p.identity.playerName)}</th><th class="peer-text">${esc(b.identity.playerName)}</th><th>主玩家差值</th><th>每窗口</th></tr></thead><tbody>${ids.map(id=>{const a=ps.get(id)||{},q=bs.get(id)||{},d=(a.windowCount||0)-(q.windowCount||0);return `<tr><td><div class="ability">${spell(a.abilityId?a:q)}<span>${esc(a.name||q.name)}</span></div></td><td>${a.windowCount||0}</td><td>${q.windowCount||0}</td><td class="delta ${d>=0?"pos":"neg"}">${d>0?"+":""}${d}</td><td>${a.perWindow||0} / ${q.perWindow||0}</td></tr>`}).join("")}</tbody></table></div></section>`}
  function timeChips(skill){return skill.timesMs?.length?skill.timesMs.map(t=>`<span class="time-chip">${fmt(t)}</span>`).join(""):`<span class="ability-sub">本场未使用</span>`}
  function tollDetail(skill){if(!skill.uses?.length)return "";return `<table class="toll-table"><thead><tr><th>时间</th><th>施放前圣能</th><th>灌注层数</th><th>实际生成</th><th>溢出</th></tr></thead><tbody>${skill.uses.map(x=>`<tr><td>${fmt(x.timeMs)}</td><td>${x.holyPower}</td><td>${x.infusionStacks}</td><td>${x.generated}</td><td class="${x.waste?"danger":""}">${x.waste}</td></tr>`).join("")}</tbody></table>`}
  function skillCard(title,key,p,b,index){const a=p.keySkills[key],q=b.keySkills[key];const special=key==="divineToll";return `<article class="skill-card"><div class="skill-title"><div class="ability">${spell(a)}<h3>7.${index} ${esc(title)}</h3></div><span class="ability-sub">逐次施放时间</span></div><div class="skill-sides"><div class="skill-side"><div class="skill-side-top"><span class="legend-chip ours">${esc(p.identity.playerName)}</span><b>${a.count} 次${a.uptimePercent?` · 覆盖 ${a.uptimePercent}%`:""}</b></div><div class="times">${timeChips(a)}</div>${special?tollDetail(a):""}</div><div class="skill-side"><div class="skill-side-top"><span class="legend-chip peer">${esc(b.identity.playerName)}</span><b>${q.count} 次${q.uptimePercent?` · 覆盖 ${q.uptimePercent}%`:""}</b></div><div class="times">${timeChips(q)}</div>${special?tollDetail(q):""}</div></div></article>`}
  function keySkills(p,b){return `<section class="section"><div class="section-head"><h2>7. 关键技能使用差异</h2><p>次数、时间点与鸣钟施放前状态</p></div><div class="section-body">${skillCard("圣洁鸣钟","divineToll",p,b,1)}${skillCard("复仇之怒","avengingWrath",p,b,2)}${skillCard("光环掌握","auraMastery",p,b,3)}</div></section>`}
  function continuityCard(player,kind){const c=player.castContinuity;const gaps=c.largestGaps?.slice(0,6)||[];return `<article class="continuity-card ${kind}"><div class="side-label">${kind==="ours"?"主玩家":"对标玩家"}</div><h3>${esc(player.identity.playerName)}</h3><div class="continuity-main"><div><b>${c.unfinishedCount}</b><span>未完成读条</span></div><div><b>${c.idleGapCount}</b><span>施法空档段</span></div><div><b>${c.lostGcdEstimate}</b><span>估算丢失公共冷却</span></div></div><div class="gap-list">${gaps.length?gaps.map(x=>`<span>${fmt(x.startMs)} · ${(x.gapMs/1000).toFixed(1)}秒</span>`).join(""):`<span>没有超过 2.5 秒的施法空档</span>`}</div></article>`}
  function continuity(p,b){return `<section class="section"><div class="section-head"><h2>8. 未完成读条与施法空档</h2><p>列出超过 2.5 秒、且不超过 15 秒的施法间隔</p></div><div class="section-body two">${continuityCard(p,"ours")}${continuityCard(b,"peer")}</div></section>`}
  function bindWindow(selectId,player){const select=document.getElementById(selectId),track=document.getElementById(`${selectId}-track`);const draw=()=>{const w=player.windows[Number(select.value)]||player.windows[0];track.innerHTML=w?.sequence?.length?w.sequence.map(castNode).join(""):`<div class="empty">这个窗口没有记录到后续施法</div>`};select.addEventListener("change",draw);draw()}
  function render(d){documentData=d;const p=d.players.primary,b=d.players.benchmark;document.getElementById("subtitle").textContent=`${d.encounter.name} · 美德道标 9 秒窗口 · ${fmt(p.durationMs)} 对 ${fmt(b.durationMs)}`;document.getElementById("app").className="";document.getElementById("app").innerHTML=`<div class="players">${playerCard(p,"ours","主玩家")}${playerCard(b,"peer","对标玩家")}</div>${startingStats(p,b)}${summary(d,p,b)}${coverage(p,b)}${resources(p,b)}${infusion(p,b)}${sequences(p,b)}${aggregate(p,b)}${keySkills(p,b)}${continuity(p,b)}`;bindWindow("primaryWindow",p);bindWindow("benchmarkWindow",b)}
  async function load(){try{const embedded=JSON.parse(document.getElementById("embedded-data").textContent||"{}");if(embedded.kind)return render(embedded);const params=new URLSearchParams(location.search);const url=params.get("data")||"/assets/samples/spec-comparisons/holy-paladin-sszorak.json";const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`读取快照失败：HTTP ${response.status}`);render(await response.json())}catch(error){document.getElementById("app").innerHTML=`<div class="error">${esc(error.message)}</div>`}}
  document.getElementById("downloadHtml").addEventListener("click",()=>{if(!documentData)return;const clone=document.documentElement.cloneNode(true);clone.querySelector("#embedded-data").textContent=JSON.stringify(documentData).replace(/<\//g,"<\\/");const blob=new Blob(["<!doctype html>\n"+clone.outerHTML],{type:"text/html;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${documentData.identity.specName}-${documentData.encounter.name}-对标.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
  load();
</script>
</body>
