<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0a07"><title>账号与公会 · V1.4.0</title><link rel="stylesheet" href="/frontend/core/design-system.css?v=az1"><style>
  .head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.head h1{margin:5px 0 0;font-size:34px}.links{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.stack{display:grid;gap:18px}.panel{padding:23px}.panel h2{margin:0 0 7px;font-size:20px}.panel>p{margin:0 0 19px}.form{display:grid;gap:13px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.danger{border-color:rgba(251,113,133,.34);color:#fecdd3}.badge{display:inline-flex;margin-left:8px;padding:2px 9px;border:1px solid var(--space-line);border-radius:99px;color:var(--space-cyan);font-size:12px}.guild-list{display:grid;gap:9px;margin-top:15px}.guild{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--space-line);border-radius:13px;background:rgba(3,8,22,.52)}.guild strong,.guild span{display:block}.guild small{color:var(--space-muted)}.guild-actions{display:flex;gap:6px}.guild-actions button{min-height:35px;padding:6px 10px}.default{color:var(--space-amber)}.guide{position:sticky;top:20px;align-self:start}.steps{margin:18px 0 0;padding:0;list-style:none;counter-reset:guide;display:grid;gap:12px}.steps li{position:relative;padding:12px 12px 12px 48px;border:1px solid var(--space-line);border-radius:13px;background:rgba(3,8,22,.5);color:#c5cede}.steps li:before{counter-increment:guide;content:counter(guide);position:absolute;left:12px;top:11px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:rgba(103,232,249,.12);color:var(--space-cyan);font-weight:850}.warning{margin-top:16px;padding:12px 14px;border-left:3px solid var(--space-amber);background:rgba(66,45,12,.22);color:#f8ddb0;font-size:13px}.guide-detail{margin-top:18px;padding:23px}.guide-detail>summary{cursor:pointer;font-size:20px;font-weight:800;color:var(--space-text)}.guide-intro{margin:14px 0 20px;color:var(--space-muted)}.guide-grid{display:grid;gap:16px}.guide-step{padding:18px;border:1px solid var(--space-line);border-radius:16px;background:rgba(3,8,22,.5)}.guide-step h3{margin:0 0 8px;font-size:17px}.guide-step p{margin:0 0 13px;color:#c5cede;line-height:1.7}.guide-shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.guide-shot{display:block;overflow:hidden;border:1px solid var(--space-line);border-radius:12px;background:#050a14}.guide-shot img{display:block;width:100%;height:auto}.guide-note{color:var(--space-amber)!important}.admin{margin-top:18px;padding:23px}.admin[hidden]{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--space-line)}td select{min-height:38px;padding:6px 9px;border:1px solid var(--space-line);border-radius:9px;background:#071021;color:var(--space-text)}.hidden{display:none!important}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.guide{position:static}}@media(max-width:650px){.head{align-items:flex-start;flex-direction:column}.guild{align-items:flex-start;flex-direction:column}.guild-actions{width:100%}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{padding:12px 0;border-bottom:1px solid var(--space-line)}td{border:0;padding:5px 0}}
</style></head><body class="cosmic-page" data-cosmic-density="240"><main class="cosmic-content cosmic-shell">
  <header class="head"><div><h1>账号与公会</h1><div id="identity" class="cosmic-muted"></div></div><nav class="links" aria-label="账号操作"><a class="cosmic-button" href="/">首页</a><a id="adminLink" class="cosmic-button" href="/admin/accounts" hidden>账号管理</a><button id="logout" class="cosmic-button" type="button">退出登录</button></nav></header>
  <div id="status" class="cosmic-muted" role="status" aria-live="polite"></div>
  <div class="layout"><div class="stack">
    <section class="glass-panel panel"><h2>共享分析服务</h2><p class="cosmic-muted">分析统一使用服务器提供的 WCL 服务，无需填写个人凭据。普通账户每小时最多分析 5 场；已获准的整份日志任务会继续完成。</p><div id="wclState" class="cosmic-muted"></div></section>
    <section class="glass-panel panel"><h2>我的公会</h2><p class="cosmic-muted">公会 ID 只需录入一次；快速分析会自动使用默认公会。</p><form id="guildForm" class="row"><label class="cosmic-field"><span>WCL 公会 ID</span><input name="guildId" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 774422" required></label><label class="cosmic-field" style="flex:0 0 auto"><span>设为默认</span><select name="isDefault"><option value="true">是</option><option value="false">否</option></select></label><button class="cosmic-button primary">验证并添加</button></form><div id="guilds" class="guild-list"></div></section>
    <section class="glass-panel panel"><h2>修改密码</h2><form id="passwordForm" class="form"><label class="cosmic-field">当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label><label class="cosmic-field">新密码<input name="newPassword" type="password" autocomplete="new-password" minlength="1" required></label><button class="cosmic-button primary">更新密码</button></form></section>
  </div></div>


</main><script src="/frontend/core/cosmic-background.js?v=1.4.0"></script><script>
let me;const statusBox=document.querySelector('#status');function status(message,error=false){statusBox.textContent=message;statusBox.classList.toggle('error',error)}async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(response.status===401){location.href='/login?next=/account';throw new Error('请先登录')}if(!response.ok)throw new Error(data.error||'操作失败');return data}function escapeHtml(value){const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML}
function guildDisplayName(guild){const name=String(guild.name||'').trim();return name&&!new RegExp(`^[工公]会\\s*${guild.id}$`).test(name)?name:`Guild ID ${guild.id}`}function renderGuilds(guilds){const host=document.querySelector('#guilds');host.innerHTML=guilds.length?guilds.map(g=>`<div class="guild"><div><strong>${escapeHtml(guildDisplayName(g))} ${g.isDefault?'<span class="badge default">默认</span>':''}</strong><small>WCL Guild ID，${g.id}</small></div><div class="guild-actions"><button class="cosmic-button" data-sync="${g.id}" data-is-default="${g.isDefault}">同步名称</button>${g.isDefault?'':`<button class="cosmic-button" data-default="${g.id}">设为默认</button>`}<button class="cosmic-button danger" data-delete="${g.id}">移除</button></div></div>`).join(''):'<div class="cosmic-muted">尚未添加公会。</div>';host.querySelectorAll('[data-sync]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{const data=await api('/api/auth/guilds',{method:'PUT',body:JSON.stringify({guildId:Number(button.dataset.sync),isDefault:button.dataset.isDefault==='true'})});renderGuilds(data.guilds);status(`已从 WCL 确认公会：${data.guild.name}`)}catch(error){status(error.message,true)}finally{button.disabled=false}});host.querySelectorAll('[data-default]').forEach(button=>button.onclick=async()=>{try{const data=await api(`/api/auth/guilds/${button.dataset.default}/default`,{method:'PUT',body:'{}'});renderGuilds(data.guilds);status('默认公会已更新')}catch(error){status(error.message,true)}});host.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('从当前账号移除这个公会？'))return;try{const data=await api(`/api/auth/guilds/${button.dataset.delete}`,{method:'DELETE'});renderGuilds(data.guilds);status('公会已移除')}catch(error){status(error.message,true)}})}
async function load(){const data=await api('/api/auth/me');me=data.user;document.querySelector('#adminLink').hidden=!me.isAdmin;document.querySelector('#identity').innerHTML=`${escapeHtml(me.username)}<span class="badge">${{viewer:'普通账户',editor:'管理员',admin:'admin'}[me.role]}</span>`;document.querySelector('#wclState').textContent=data.wcl.configured?'共享服务已配置，实时额度见页面进度条。':'共享服务尚未配置，请联系管理员。';renderGuilds(data.guilds||[]);}
document.querySelector('#guildForm').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;const values=Object.fromEntries(new FormData(form));values.isDefault=values.isDefault==='true';try{const data=await api('/api/auth/guilds',{method:'PUT',body:JSON.stringify(values)});renderGuilds(data.guilds);form.reset();status(`已从 WCL 确认公会：${data.guild.name}（ID ${data.guild.id}）`)}catch(error){status(error.message,true)}};document.querySelector('#passwordForm').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;try{await api('/api/auth/password',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();status('密码已更新，其他登录会话已退出')}catch(error){status(error.message,true)}};document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST',body:'{}'}).catch(()=>{});location.href='/login'};load().catch(error=>status(error.message,true));
</script><script src="/frontend/core/azeroth-shell.js?v=20261013-shared"></script></body></html>
