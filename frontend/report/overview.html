<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>全场战斗概览</title>
  <link rel="stylesheet" href="frontend/report/overview.css?v=20261019-v150c">
</head>
<body>
  <main class="shell">
    <header class="report-head">
      <div>
        <div id="raidName" class="eyebrow">战斗分析</div>
        <h1 id="bossName">全场战斗概览</h1>
      </div>
      <div id="lastPull" class="last-pull">正在载入分析结果…</div>
      <div class="toolbar">
        <a class="button" href="/">首页</a>
        <a class="button" href="/report">选择结果</a>
        <a class="button" href="/online">在线分析</a>
        <button id="downloadJson" class="button" type="button">下载 JSON</button>
        <label class="button">导入 JSON<input id="importJson" type="file" accept=".json,application/json" hidden></label>
      </div>
    </header>

    <section class="panel overview-body">
      <div id="error" class="error"></div>
      <div class="overview-tabs" role="tablist" aria-label="概览内容">
        <button id="pullsTab" class="overview-tab active" type="button" role="tab" aria-selected="true">战斗列表</button>
        <button id="mechanicsTab" class="overview-tab" type="button" role="tab" aria-selected="false">机制统计</button>
      </div>
      <div id="reportModules"></div>
      <div id="pullsPanel" class="overview-panel" role="tabpanel">
        <div class="overview-tools">
          <div class="toolbar">
            <button id="wipesFilter" class="filter-link wipes" type="button">全部灭团</button>
            <button id="allFilter" class="filter-link all active" type="button">全部战斗</button>
          </div>
          <div class="toolbar">
            <label class="check">难度 <select id="difficultyFilter"><option value="all">全部难度（分组展示）</option></select></label>
            <label class="check"><input id="separatePhases" type="checkbox" checked> 按阶段分组</label>
            <button id="sortButton" class="button" type="button">时间正序</button>
          </div>
        </div>
        <div id="pullBoard" class="pull-board"><div class="empty">正在读取整场 Pull…</div></div>
        <p class="progress-legend" aria-label="全程完成度配色"><span style="--tier:#999999">&lt;25% 灰</span><span style="--tier:#1eff00">25%–50% 绿</span><span style="--tier:#0070ff">50%–75% 蓝</span><span style="--tier:#a335ee">75%–95% 紫</span><span style="--tier:#ff8000">95%–99% 橙</span><span style="--tier:#e268a8">≥99% 粉</span>颜色按全程完成度；卡片数值保留当前 Boss 剩余血量。</p>
      </div>
      <div id="mechanicsPanel" class="overview-panel" role="tabpanel" hidden>
        <div id="mechanicOverview" class="mechanic-overview"></div>
      </div>
    </section>
  </main>
  <script src="frontend/core/report-plugin-runtime.js?v=20261019-v150c"></script>
  <script src="frontend/core/pull-progress.js?v=20261019-v150c"></script>
  <script src="frontend/report/overview.js?v=20261019-v150c"></script>
  <script src="/frontend/core/home-button.js?v=1"></script>
<script src="frontend/core/azeroth-shell.js?v=20261013-shared"></script></body>
</html>
