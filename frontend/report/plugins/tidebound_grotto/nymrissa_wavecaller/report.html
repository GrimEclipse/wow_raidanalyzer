<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030711">
  <title>尼姆瑞莎·唤潮者 · 战斗复盘</title>
  <link rel="stylesheet" href="/frontend/core/design-system.css?v=1.3.0">
  <style>
    .report-shell{position:relative;z-index:1;width:min(1320px,calc(100% - 32px));margin:auto;padding:28px 0 60px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--space-line)}.head h1{margin:5px 0 4px;font-size:30px}.actions{display:flex;gap:8px;flex-wrap:wrap}.picker{min-width:260px}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:18px 0}.stat{padding:14px;border:1px solid var(--space-line);border-radius:13px;background:rgba(6,14,31,.72)}.stat strong,.stat span{display:block}.stat strong{font-size:20px}.stat span{margin-top:3px;color:var(--space-muted);font-size:11px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{border-color:var(--space-cyan);background:rgba(34,211,238,.12);color:#e9fdff}.panel{margin-bottom:12px;padding:20px}.panel h2{margin:0 0 7px;font-size:18px}.panel h3{margin:20px 0 8px;font-size:14px}.hint{margin:0 0 15px;color:var(--space-muted);font-size:12px;line-height:1.65}.alert{border-color:rgba(251,113,133,.36);background:rgba(67,13,31,.28)}.ok{border-color:rgba(52,211,153,.3);background:rgba(6,55,43,.24)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 9px;text-align:left;border-bottom:1px solid var(--space-line);vertical-align:top}th{color:#8090ae;font-size:11px}.player{font-weight:750}.badge{display:inline-flex;padding:2px 7px;border:1px solid var(--space-line);border-radius:99px;color:#b8c8e4;font-size:11px}.bad{border-color:rgba(251,113,133,.45);color:#fda4af}.good{border-color:rgba(52,211,153,.45);color:#6ee7b7}.empty{padding:22px;border:1px dashed var(--space-line);border-radius:12px;color:var(--space-muted);text-align:center}.error{min-height:22px;margin-top:12px;color:#fda4af}.file-button{position:relative;overflow:hidden}.file-button input{position:absolute;inset:0;opacity:0;cursor:pointer}a.spell{color:#8be9fb;text-decoration:none}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.picker{width:100%}}
  </style>
</head>
<body class="cosmic-page" data-cosmic-density="230">
<main class="report-shell">
  <header class="head"><div><div class="cosmic-eyebrow">潮缚石窟 · 基础复盘</div><h1 id="title">尼姆瑞莎·唤潮者</h1><div id="meta" class="cosmic-muted">正在读取分析结果…</div></div><nav class="actions"><select id="pullSelect" class="picker" aria-label="选择战斗"></select><a id="wclLink" class="cosmic-button" href="#" target="_blank" rel="noreferrer">打开 WCL</a><a id="overviewLink" class="cosmic-button" href="/report">全场概览</a><label class="cosmic-button file-button">导入 JSON<input id="fileInput" type="file" accept=".json,application/json"></label></nav></header>
  <section id="stats" class="stats"></section>
  <nav id="tabs" class="tabs"></nav>
  <div id="content"></div>
  <div id="error" class="error" role="status"></div>
</main>
<script src="/frontend/core/report-plugin-runtime.js?v=1.3.0"></script>
<script src="/frontend/core/cosmic-background.js?v=1.3.0"></script>
<script src="/frontend/report/plugins/tidebound_grotto/nymrissa_wavecaller/report.js?v=1.3.0"></script>
</body>
</html>
