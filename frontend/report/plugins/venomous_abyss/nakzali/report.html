<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../../../../">
  <title>盘魂者内克扎利 · 开荒断案</title>
  <link rel="stylesheet" href="frontend/report/plugins/venomous_abyss/nakzali/report.css">
</head>
<body>
<section id="overviewPage" class="overview">
  <header class="report-head">
    <div>
      <div class="eyebrow">12.1 · 烈毒之渊 · 难度按 Pull 标记</div>
      <h1>盘魂者内克扎利</h1>
    </div>
    <div id="lastPull" class="last-pull">尚未载入分析结果</div>
    <div class="toolbar">
      <a class="button" href="/online">在线分析</a>
      <a class="button" href="/report">选择结果</a>
      <label class="button">导入 JSON<input id="overviewFile" type="file" accept=".json" hidden></label>
    </div>
  </header>
  <nav id="overviewTabs" class="page-tabs panel">
    <button data-overview-tab="pulls" class="active">全部战斗</button>
    <button data-overview-tab="analysis">数据分析</button>
  </nav>
  <section id="pullsView" class="panel overview-body">
    <div class="overview-tools">
      <div class="toolbar"><button id="wipesFilter" class="filter-link wipes">全部灭团</button><button id="allFilter" class="filter-link all active">全部战斗</button></div>
      <div class="toolbar"><label class="check"><input id="separatePhases" type="checkbox" checked> 按阶段分组</label><button id="sortButton" class="button">时间正序</button></div>
    </div>
    <div id="overviewError" class="error"></div>
    <div id="pullBoard" class="pull-board"><div class="empty">请运行在线分析，选择已生成结果，或导入分析 JSON。</div></div>
  </section>
  <section id="analysisView" class="hidden">
    <div id="analysisTags" class="analysis-tags panel"></div>
    <div id="analysisContent" class="analysis-content"></div>
  </section>
</section>

<section id="detailPage" class="hidden">
  <header class="detail-header">
    <div><h1 id="detailTitle">盘魂者内克扎利单场开庭分析</h1><div id="detailMeta" class="muted">等待选择 Pull</div></div>
    <div class="toolbar"><button id="backButton" class="button">返回全部战斗</button><a id="wclLink" class="button" target="_blank" rel="noreferrer">WCL 原始记录</a><label class="button">导入 JSON<input id="detailFile" type="file" accept=".json" hidden></label></div>
  </header>
  <main class="detail-main">
    <section id="stats" class="stats panel"></section>
    <nav id="detailTabs" class="page-tabs panel"><button data-tab="survival" class="active">全场存活情况</button><button data-tab="essence">精华撕裂放置</button><button data-tab="flames">噬灭 / 蛇形烈焰</button><button data-tab="inner">史诗内场组</button><button data-tab="avoidable">可规避机制</button><button data-tab="tank">坦克换嘲 / 附身弹幕</button></nav>
    <section id="tabContent" class="tab-content"></section>
  </main>
</section>
<script src="frontend/core/report-plugin-runtime.js?v=1.2.1-20260903"></script>
<script src="assets/vendor/wow-tooltips.js?v=5"></script>
<script src="frontend/report/plugins/venomous_abyss/nakzali/report.js?v=1.3.0-20260903"></script>
<script src="/frontend/core/home-button.js?v=1"></script>
</body>
</html>
