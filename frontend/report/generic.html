<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>通用战斗报告</title>
  <style>
    :root{color-scheme:dark;--bg:#060a12;--panel:#111827;--panel2:#0b1220;--line:#28364a;--muted:#94a3b8;--ink:#e5e7eb;--blue:#60a5fa;--red:#fb7185;--green:#34d399}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 system-ui,"Microsoft YaHei",sans-serif}a{color:var(--blue);text-decoration:none}
    main{max-width:1400px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}
    h1,h2,h3{margin:0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.button,input{border:1px solid #3b4b63;background:#0b1220;color:var(--ink);border-radius:7px;padding:8px 11px}
    section{margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:15px}
    .pull-head{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-block;border:1px solid #475569;border-radius:999px;padding:2px 8px;font-size:11px}.wipe{color:var(--red)}.kill{color:var(--green)}
    table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:8px;border-bottom:1px solid #223047}th{color:#cbd5e1}.board{overflow:auto}.empty{padding:26px;border:1px dashed #334155;border-radius:10px;color:var(--muted)}
  </style>
</head>
<body>
<main>
  <header><div><div class="muted">GENERIC REPORT RENDERER</div><h1 id="title">通用战斗报告</h1><div id="subtitle" class="muted">等待载入数据</div></div><div class="toolbar"><a class="button" href="frontend/report/index.html">切换分析</a><label class="button">导入 JSON<input id="file" type="file" accept=".json,application/json" hidden></label></div></header>
  <div id="error" class="muted" style="margin-top:14px"></div>
  <section><h2>逐场灭团分析</h2><div id="pulls" class="grid" style="margin-top:12px"></div></section>
  <section><h2>可躲避伤害</h2><div id="boards" class="grid" style="margin-top:12px"></div></section>
</main>
<script>
  const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const num=value=>Number(value||0).toLocaleString("zh-CN");

  function pullsOf(data){
    const value=data.page1_wipeAnalysis;
    if(Array.isArray(value))return value;
    if(value&&typeof value==="object")return [value];
    return [];
  }

  function render(payload){
    const meta=payload.meta||{},data=payload.data||{};
    document.getElementById("title").textContent=meta.bossName||meta.bossKey||"通用战斗报告";
    document.getElementById("subtitle").textContent=`${meta.version||""} · ${meta.raidName||meta.raidKey||""} · ${meta.analyzedReports?.join(", ")||""}`;
    const pulls=pullsOf(data);
    document.getElementById("pulls").innerHTML=pulls.length?pulls.map(fight=>`
      <article class="card">
        <div class="pull-head"><h3>Fight ${esc(fight.fightID??fight.id??"-")}</h3><span class="badge ${fight.isKill||fight.kill?"kill":"wipe"}">${fight.isKill||fight.kill?"击杀":"灭团"} · ${esc(fight.duration||"")}</span></div>
        <p><strong>${esc(fight.wipePhase||fight.fightPhase||"未知阶段")}</strong> · ${esc(fight.wipeReason||fight.reason||"未归因")}</p>
        <div class="muted">${esc(fight.investigation||fight.summary||"暂无进一步归因")}</div>
        ${fight.wclDeepLink?`<p><a href="${esc(fight.wclDeepLink)}" target="_blank" rel="noreferrer">查看 WCL 证据</a></p>`:""}
      </article>`).join(""):'<div class="empty">该插件没有输出逐场灭团数据。</div>';

    const boards=data.page2_avoidableBoard||{};
    const entries=Object.entries(boards).filter(([,rows])=>Array.isArray(rows));
    document.getElementById("boards").innerHTML=entries.length?entries.map(([key,rows])=>`
      <article class="card board"><h3>${esc(rows[0]?.spellName||key)}</h3><table><thead><tr><th>玩家</th><th>次数</th><th>伤害</th><th>死亡</th></tr></thead><tbody>
      ${rows.map(row=>`<tr><td>${esc(row.name)}</td><td>${num(row.hitCount)}</td><td>${num(row.totalDamage)}</td><td>${num(row.deathCount)}</td></tr>`).join("")}
      </tbody></table></article>`).join(""):'<div class="empty">该插件没有输出可躲避伤害榜。</div>';
  }

  async function loadPath(path){
    const response=await fetch(path,{cache:"no-store"});
    if(!response.ok)throw new Error(`读取失败：HTTP ${response.status}`);
    render(await response.json());
  }
  document.getElementById("file").addEventListener("change",async event=>{
    try{render(JSON.parse(await event.target.files[0].text()));document.getElementById("error").textContent=""}
    catch(error){document.getElementById("error").textContent=`无法载入文件：${error.message}`}
  });
  const path=new URLSearchParams(location.search).get("json");
  if(path)loadPath(path).catch(error=>document.getElementById("error").textContent=error.message);
  else document.getElementById("error").textContent="请从报告入口选择分析文件，或导入本地 JSON。";
</script>
</body>
</html>
