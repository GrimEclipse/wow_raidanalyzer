<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地报告库 · V1.3.0</title><link rel="stylesheet" href="/frontend/core/design-system.css?v=1.3.0"><style>
  .head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:34px}.head h1{margin:5px 0 0;font-size:36px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{padding:24px}.panel h2{margin:0 0 8px}.drop{position:relative;display:grid;place-items:center;min-height:230px;margin-top:19px;padding:24px;border:1px dashed rgba(103,232,249,.38);border-radius:16px;background:radial-gradient(circle at 50% 20%,rgba(103,232,249,.09),transparent 70%);text-align:center;transition:.2s}.drop:hover{border-color:var(--space-cyan);background-color:rgba(14,116,144,.07)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop-icon{font-size:38px;color:var(--space-cyan)}.recent{display:grid;gap:9px;margin-top:18px}.recent-row{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--space-line);border-radius:12px;background:rgba(3,8,22,.5)}.recent-row button{border:0;background:none;color:inherit;text-align:left;cursor:pointer}.recent-row strong,.recent-row small{display:block}.recent-row small{margin-top:3px;color:var(--space-muted)}.delete{color:var(--space-red)!important}.empty{padding:20px;border:1px dashed var(--space-line);border-radius:12px;color:var(--space-muted);text-align:center}.admin{display:none;margin-top:18px}.admin.visible{display:block}.row{display:flex;gap:9px}.row select{flex:1;min-width:0;padding:9px;border:1px solid var(--space-line);border-radius:10px;background:#071021;color:var(--space-text)}.status{min-height:24px;margin-top:14px}.privacy{margin-top:18px;padding:13px;border-left:3px solid var(--space-green);background:rgba(20,83,45,.12);color:#bcebd7;font-size:13px}@media(max-width:820px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body class="cosmic-page" data-cosmic-density="220"><main class="cosmic-content cosmic-shell"><header class="head"><div><div class="cosmic-eyebrow">Local-first reports</div><h1>本地报告库</h1><p class="cosmic-muted">打开、识别并浏览你自己保存的分析 JSON。</p></div><a class="cosmic-button" href="/">返回首页</a></header><div class="grid"><section class="glass-panel panel"><h2>打开本地分析文件</h2><p class="cosmic-muted">选择后会自动识别 Boss 并进入对应报告。</p><label class="drop"><input id="file" type="file" accept=".json,application/json"><span><span class="drop-icon">✦</span><strong style="display:block;margin-top:8px">选择分析 JSON</strong><small class="cosmic-muted">文件不会上传到服务器</small></span></label><div class="privacy">报告保存在当前浏览器的本地数据库中，可以跨页面打开；你可以随时从右侧清除。</div><div id="status" class="status cosmic-muted" role="status"></div></section><section class="glass-panel panel"><h2>最近打开</h2><p class="cosmic-muted">仅存在于当前浏览器。</p><div id="recent" class="recent"><div class="empty">正在读取本地报告…</div></div><section id="serverPanel" class="admin"><h2>服务器数据 · 管理员</h2><p class="cosmic-muted">仅用于维护与内置样本检查。</p><div class="row"><select id="source"><option value="">正在读取…</option></select><button id="open" class="cosmic-button">打开</button></div></section></section></div></main><script src="/frontend/core/report-plugin-runtime.js?v=1.3.0"></script><script src="/frontend/core/cosmic-background.js?v=1.3.0"></script><script>
const $=id=>document.getElementById(id),status=$('status');function escapeHtml(value){const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML}async function resolvePayload(payload,path,autoOpen=true,label=''){const identity=window.MythicReportRuntime.identityOf(payload);status.textContent=`已识别：${identity.bossName}，准备进入公共全场 Pull 概览`;let descriptor;try{descriptor=await window.MythicReportRuntime.loadDescriptor(payload)}catch(error){throw new Error(`暂不支持：${error.message}`)}const sourcePath=path||await window.MythicReportRuntime.storePayload(payload,{label:label||identity.bossName});if(autoOpen)location.href=window.MythicReportRuntime.reportUrl(descriptor,sourcePath);return true}async function openPath(path){if(!path)return;status.textContent='正在识别 Boss…';if(/^(idb|session):/.test(path)){await resolvePayload(await window.MythicReportRuntime.loadPayload(path),path,true);return}const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error(`读取失败：HTTP ${response.status}`);await resolvePayload(await response.json(),path,true)}async function renderRecent(){const rows=await window.MythicReportRuntime.listLocalPayloads();$('recent').innerHTML=rows.length?rows.map(row=>`<div class="recent-row"><button data-open="${escapeHtml(row.sourcePath)}"><strong>${escapeHtml(row.label||row.identity?.bossName||'分析报告')}</strong><small>${escapeHtml(row.identity?.bossName||'未知 Boss')} · ${new Date(row.savedAt).toLocaleString('zh-CN')}</small></button><button class="delete" data-delete="${escapeHtml(row.sourcePath)}" title="清除">×</button></div>`).join(''):'<div class="empty">还没有打开过本地报告。</div>';$('recent').querySelectorAll('[data-open]').forEach(button=>button.onclick=async()=>{try{const payload=await window.MythicReportRuntime.loadPayload(button.dataset.open);await resolvePayload(payload,button.dataset.open,true)}catch(error){status.textContent=error.message}});$('recent').querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{await window.MythicReportRuntime.deleteLocalPayload(button.dataset.delete);await renderRecent()})}async function loadServerSources(){const me=await fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null);if(!me?.user?.isAdmin)return;$('serverPanel').classList.add('visible');const files=[];const appendFiles=rows=>{for(const file of rows||[]){if(file?.path&&!files.some(row=>row.path===file.path))files.push(file)}};for(const path of ['/api/data-files','assets/samples/report_manifest.json','data/manifest.json']){try{const response=await fetch(path,{cache:'no-store'});if(response.ok)appendFiles((await response.json()).files)}catch(_){}}$('source').innerHTML='<option value="">选择服务器文件</option>'+files.map(file=>`<option value="${escapeHtml(file.path)}">${escapeHtml(file.label||file.name||file.path)}</option>`).join('')}
$('file').onchange=async event=>{const file=event.target.files?.[0];if(!file)return;status.textContent='正在读取本地文件…';try{await resolvePayload(JSON.parse(await file.text()),'',true,file.name)}catch(error){status.textContent=`无法识别文件：${error.message}`}finally{event.target.value=''}};$('open').onclick=()=>openPath($('source').value).catch(error=>status.textContent=error.message);Promise.all([renderRecent(),loadServerSources()]).then(()=>{const path=new URLSearchParams(location.search).get('json');if(path)openPath(path).catch(error=>status.textContent=error.message)});
</script></body></html>
