<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地报告库 · V1.3.2</title><link rel="icon" href="/frontend/assets/theme/favicon.png"><link rel="stylesheet" href="/frontend/core/design-system.css?v=az1"><style>
  .head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--az-line)}
  .head-brand{display:flex;align-items:center;gap:16px}.head-brand img{width:56px;height:56px;filter:drop-shadow(0 2px 6px #000)}
  .head h1{margin:6px 0 2px;font-size:32px;color:var(--az-gold-hi)}.head p{margin:0;font-size:14px}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}.panel{padding:24px}.panel h2{margin:0 0 6px;font-size:20px;color:var(--az-gold-hi)}.panel>p{margin:0;font-size:13px;color:#b3a58c}
  .drop{position:relative;display:grid;place-items:center;min-height:220px;margin-top:18px;padding:24px;border:1px dashed var(--az-brass);border-radius:3px;background:radial-gradient(ellipse at 50% 30%,rgba(255,150,40,.08),transparent 70%),var(--az-inset);box-shadow:inset 0 2px 10px rgba(0,0,0,.7);text-align:center;transition:.2s}
  .drop:hover{border-color:var(--az-gold);background-color:#15100b}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop-icon{display:block;width:64px;height:64px;margin:0 auto;border-radius:4px;background:#000 url("/zamimg/images/wow/icons/large/inv_scroll_03.jpg") center/cover;box-shadow:0 0 0 1px #000,0 0 0 2px var(--az-brass),0 4px 12px rgba(0,0,0,.8)}
  .drop:hover .drop-icon{box-shadow:0 0 0 1px #000,0 0 0 2px var(--az-gold),0 0 18px rgba(255,170,60,.35)}
  .drop strong{color:var(--az-text);font:700 17px var(--f-title)}
  .recent{display:grid;gap:6px;margin-top:16px}
  .recent-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--az-line);border-left:3px solid var(--q-epic);border-radius:2px;background:var(--az-inset);transition:border-color .15s,background .15s}
  .recent-row:hover{border-color:var(--az-brass);border-left-color:var(--q-legendary);background:#17120d}
  .recent-row button{border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
  .recent-row strong{display:block;color:var(--az-text);font-weight:600}.recent-row small{display:block;margin-top:2px;color:var(--az-muted);font-size:12px}
  .delete{flex:none;width:28px;height:28px;border-radius:50%!important;color:var(--az-muted)!important;font-size:18px!important;line-height:1}.delete:hover{background:#3a1410!important;color:var(--c-wipe)!important}
  .empty{padding:22px 16px;border:1px solid var(--az-line);border-radius:3px;background:var(--az-inset);color:#b3a58c;text-align:center;font-size:13px}
  .admin{display:none;margin-top:22px;padding-top:18px;border-top:1px solid var(--az-line)}.admin.visible{display:block}.admin h2{font-size:17px}
  .row{display:flex;gap:8px;margin-top:12px}.row select{flex:1;min-width:0}
  .status{min-height:24px;margin-top:14px;font-size:13px}
  .privacy{margin-top:16px;padding:10px 12px;border-left:2px solid var(--az-brass);background:rgba(215,179,106,.06);color:#d6c9b1;font-size:13px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body class="cosmic-page" data-cosmic-density="220"><main class="cosmic-content cosmic-shell"><header class="head"><div class="head-brand"><img src="/frontend/assets/theme/emblem-128.webp" alt="" width="56" height="56"><div><div class="cosmic-eyebrow">开荒工具包</div><h1>本地报告库</h1><p class="cosmic-muted">打开你自己保存的分析 JSON，自动认出是哪个 Boss。</p></div></div><a class="cosmic-button" href="/">返回首页</a></header><div class="grid"><section class="glass-panel panel"><h2>打开本地分析文件</h2><p class="cosmic-muted">选择后会自动识别 Boss 并进入对应报告。</p><label class="drop"><input id="file" type="file" accept=".json,application/json"><span><span class="drop-icon"></span><strong style="display:block;margin-top:12px">选择或拖入分析 JSON</strong><small class="cosmic-muted">文件只在浏览器里处理，不会上传</small></span></label><div class="privacy">报告存在这台电脑的浏览器里，换页面也能再打开；不想留可以在「最近打开」里删掉。</div><div id="status" class="status cosmic-muted" role="status"></div></section><section class="glass-panel panel"><h2>最近打开</h2><p class="cosmic-muted">本地导入和服务器报告都在这里，最近打开的排最前。</p><div id="recent" class="recent"><div class="empty">正在读取本地报告…</div></div><section id="serverPanel" class="admin"><h2>服务器数据</h2><p class="cosmic-muted">有编辑权限的账号可以直接打开服务器上的报告。</p><div class="row"><select id="source" class="az-select"><option value="">正在读取…</option></select><button id="open" class="cosmic-button">打开</button></div></section></section></div></main><script src="/frontend/core/report-plugin-runtime.js?v=20260921-recent-reports"></script><script src="/frontend/core/cosmic-background.js?v=az1"></script><script>
const $=id=>document.getElementById(id),status=$('status');function escapeHtml(value){const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML}async function resolvePayload(payload,path,autoOpen=true,label=''){const identity=window.MythicReportRuntime.identityOf(payload);status.textContent=`已识别：${identity.bossName}，准备进入公共全场 Pull 概览`;let descriptor;try{descriptor=await window.MythicReportRuntime.loadDescriptor(payload)}catch(error){throw new Error(`暂不支持：${error.message}`)}const sourcePath=path||await window.MythicReportRuntime.storePayload(payload,{label:label||identity.bossName});if(autoOpen)location.href=window.MythicReportRuntime.reportUrl(descriptor,sourcePath);return true}async function openPath(path){if(!path)return;status.textContent='正在识别 Boss…';if(/^(idb|session):/.test(path)){await resolvePayload(await window.MythicReportRuntime.loadPayload(path),path,true);return}await resolvePayload(await window.MythicReportRuntime.loadPayload(path),path,true)}async function renderRecent(){const rows=await window.MythicReportRuntime.listLocalPayloads();$('recent').innerHTML=rows.length?rows.map(row=>`<div class="recent-row"><button data-open="${escapeHtml(row.sourcePath)}"><strong>${escapeHtml(row.label||row.identity?.bossName||'分析报告')}</strong><small>${escapeHtml(row.identity?.bossName||'未知 Boss')}，${new Date(row.savedAt).toLocaleString('zh-CN')}</small></button><button class="delete" data-delete="${escapeHtml(row.sourcePath)}" title="清除">×</button></div>`).join(''):'<div class="empty">还没有打开过报告，从左边选一个 JSON 开始。</div>';$('recent').querySelectorAll('[data-open]').forEach(button=>button.onclick=async()=>{try{const payload=await window.MythicReportRuntime.loadPayload(button.dataset.open);await resolvePayload(payload,button.dataset.open,true)}catch(error){status.textContent=error.message}});$('recent').querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{await window.MythicReportRuntime.deleteLocalPayload(button.dataset.delete);await renderRecent()})}async function loadServerSources(){const me=await fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null);if(!me?.user?.canModify)return;$('serverPanel').classList.add('visible');const files=[];const appendFiles=rows=>{for(const file of rows||[]){if(file?.path&&!files.some(row=>row.path===file.path))files.push(file)}};for(const path of ['/api/data-files','assets/samples/report_manifest.json','data/manifest.json']){try{const response=await fetch(path,{cache:'no-store'});if(response.ok)appendFiles((await response.json()).files)}catch(_){}}$('source').innerHTML='<option value="">选择服务器文件</option>'+files.map(file=>`<option value="${escapeHtml(file.path)}">${escapeHtml(String(file.label||file.name||file.path).replace(/\s+·\s+/g,'，'))}</option>`).join('')}
$('file').onchange=async event=>{const file=event.target.files?.[0];if(!file)return;status.textContent='正在读取本地文件…';try{await resolvePayload(JSON.parse(await file.text()),'',true,file.name)}catch(error){status.textContent=`无法识别文件：${error.message}`}finally{event.target.value=''}};$('open').onclick=()=>openPath($('source').value).catch(error=>status.textContent=error.message);Promise.all([renderRecent(),loadServerSources()]).then(()=>{const path=new URLSearchParams(location.search).get('json');if(path)openPath(path).catch(error=>status.textContent=error.message)});
</script><script src="/frontend/core/azeroth-shell.js?v=6"></script></body></html>
