<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大秘境抄轴工具</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070b14;
            --panel: #0f1726;
            --panel2: #111c2e;
            --line: #263348;
            --muted: #99a8bc;
            --text: #edf3fb;
            --blue: #60a5fa;
            --green: #34d399;
            --amber: #fbbf24;
            --red: #fb7185;
            --violet: #a78bfa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        }
        main {
            width: min(1240px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 56px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-end;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(28px, 4vw, 40px); }
        h2 { font-size: 20px; }
        h3 { font-size: 16px; }
        a { color: inherit; }
        code { color: #c4b5fd; }
        .muted { color: var(--muted); }
        .eyebrow {
            color: var(--violet);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .notice {
            margin: 18px 0;
            border: 1px solid rgba(251, 191, 36, .35);
            background: rgba(251, 191, 36, .08);
            color: #fde68a;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(320px, .85fr);
            gap: 16px;
            align-items: start;
        }
        .panel {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 8px;
            padding: 16px;
        }
        .stack { display: grid; gap: 16px; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 16px 0;
        }
        button, select {
            border: 1px solid var(--line);
            background: #111a2c;
            color: var(--text);
            border-radius: 8px;
            padding: 8px 11px;
            font: inherit;
        }
        button { cursor: pointer; }
        button.active {
            border-color: var(--violet);
            background: rgba(167, 139, 250, .18);
        }
        .boss-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 18px 0 14px;
        }
        .boss-tab {
            text-align: left;
            min-height: 76px;
        }
        .boss-tab strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .boss-tab span {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 14px 0;
        }
        .stat {
            border: 1px solid var(--line);
            background: #0b1220;
            border-radius: 8px;
            padding: 12px;
        }
        .stat strong {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .timeline {
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }
        .timeline-head,
        .row {
            display: grid;
            grid-template-columns: 84px 86px 150px minmax(0, 1fr) 130px;
            gap: 10px;
            align-items: center;
        }
        .timeline-head {
            background: #182235;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 12px;
        }
        .row {
            min-height: 42px;
            padding: 9px 12px;
            border-top: 1px solid #1f2a3b;
            background: #0b1220;
        }
        .row:nth-child(even) { background: #0f1726; }
        .time {
            color: var(--green);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .badge {
            width: max-content;
            border: 1px solid #334155;
            border-radius: 999px;
            padding: 3px 8px;
            color: #cbd5e1;
            font-size: 12px;
            white-space: nowrap;
        }
        .badge.boss { color: var(--red); border-color: rgba(251, 113, 133, .5); }
        .badge.player { color: var(--blue); border-color: rgba(96, 165, 250, .5); }
        .badge.potion { color: var(--amber); border-color: rgba(251, 191, 36, .55); }
        .badge.trash { color: var(--green); border-color: rgba(52, 211, 153, .5); }
        .source, .target, .ability {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ability small {
            color: var(--muted);
            margin-left: 6px;
        }
        .empty {
            border: 1px dashed var(--line);
            border-radius: 8px;
            color: var(--muted);
            padding: 14px;
        }
        .waves {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }
        .wave {
            border-left: 3px solid var(--amber);
            background: #0b1220;
            border-radius: 0 8px 8px 0;
            padding: 10px 12px;
            line-height: 1.6;
        }
        .wave strong { color: #fde68a; }
        .mini-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }
        .mini {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #0b1220;
            padding: 10px;
            color: #dbeafe;
        }
        @media (max-width: 980px) {
            .layout, .stats, .boss-tabs { grid-template-columns: 1fr; }
            header { display: block; }
            .timeline-head { display: none; }
            .row {
                grid-template-columns: 76px minmax(0, 1fr);
            }
            .row .badge, .row .source, .row .target {
                grid-column: 2;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <div class="eyebrow">Mythic+ Timeline</div>
            <h1>大秘境抄轴工具</h1>
            <p class="muted">固定读取 <code>mythic_dungeon_export/wcl_casts_log.json</code>，按 Boss 战斗窗口计算相对时间轴。</p>
        </div>
        <a class="muted" href="/">返回首页</a>
    </header>

    <div id="status" class="notice">正在读取大秘境时间轴 JSON...</div>

    <section id="bossTabs" class="boss-tabs"></section>

    <section class="layout">
        <div class="panel">
            <div>
                <h2 id="bossTitle">Boss 时间轴</h2>
                <p id="bossSubtitle" class="muted">选择 Boss 后查看具体出招与玩家应对。</p>
            </div>
            <div class="stats" id="stats"></div>
            <div class="toolbar">
                <select id="typeFilter" aria-label="筛选事件类型">
                    <option value="all">全部关键事件</option>
                    <option value="boss">Boss 出招</option>
                    <option value="player">玩家应对</option>
                    <option value="potion">药水 / 爆发</option>
                    <option value="trash">小怪 / 环境</option>
                </select>
                <select id="playerFilter" aria-label="筛选玩家">
                    <option value="all">全队</option>
                </select>
            </div>
            <div id="bossTimeline"></div>
        </div>

        <aside class="stack">
            <section class="panel">
                <h2>药水 / 爆发波次</h2>
                <div id="waves" class="waves"></div>
            </section>
            <section class="panel">
                <h2>玩家</h2>
                <div id="players" class="mini-list"></div>
            </section>
            <section class="panel">
                <h2>副本关键轴</h2>
                <p class="muted">这里保留全副本关键事件的摘要，不再把原始全量 cast 铺到主视图。</p>
                <div id="dungeonSummary" class="mini-list"></div>
            </section>
        </aside>
    </section>
</main>

<script>
const DATA_URL = "mythic_dungeon_export/wcl_casts_log.json";
const state = {
    payload: null,
    selectedBoss: "",
    typeFilter: "all",
    playerFilter: "all",
};

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[ch]));
}

function seconds(value) {
    return `${Number(value || 0).toFixed(1)}s`;
}

function typeLabel(type) {
    return {
        boss: "Boss",
        player: "玩家",
        potion: "药水",
        trash: "小怪",
        other: "其他",
    }[type] || "其他";
}

function normalizeLegacy(payload) {
    if (!Array.isArray(payload)) return payload;
    return {
        meta: { exportType: "legacy-raw-casts", version: 1 },
        dungeon: { name: "未知副本" },
        players: [],
        bossTimelines: [],
        potionWaves: [],
        dungeonTimeline: [],
        rawCounts: { friendlyCasts: payload.length, enemyCasts: 0, relevantEvents: 0 },
    };
}

function bossList() {
    return state.payload?.bossTimelines || [];
}

function selectedBoss() {
    return bossList().find(boss => boss.key === state.selectedBoss) || bossList()[0] || null;
}

function eventVisible(event) {
    if (state.typeFilter !== "all" && event.type !== state.typeFilter) return false;
    if (state.playerFilter === "all") return true;
    const playerID = Number(state.playerFilter);
    return event.sourceID === playerID || event.targetID === playerID || event.type === "boss" || event.type === "trash";
}

function renderBossTabs() {
    const holder = document.getElementById("bossTabs");
    holder.innerHTML = "";
    for (const boss of bossList()) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `boss-tab ${boss.key === state.selectedBoss ? "active" : ""}`;
        button.innerHTML = `
            <strong>${escapeHtml(boss.name)}</strong>
            <span>${boss.found ? `${seconds(boss.duration)} / ${boss.events.length} 条` : "未命中敌对施法"}</span>
        `;
        button.addEventListener("click", () => {
            state.selectedBoss = boss.key;
            render();
        });
        holder.appendChild(button);
    }
}

function renderFilters() {
    document.getElementById("typeFilter").value = state.typeFilter;
    const select = document.getElementById("playerFilter");
    const current = state.playerFilter;
    select.innerHTML = `<option value="all">全队</option>`;
    for (const player of state.payload.players || []) {
        const option = document.createElement("option");
        option.value = String(player.id);
        option.textContent = `${player.name}${player.role && player.role !== "玩家" ? `（${player.role}）` : ""}`;
        select.appendChild(option);
    }
    select.value = [...select.options].some(option => option.value === current) ? current : "all";
    state.playerFilter = select.value;
}

function renderStats(boss, events) {
    const bossCount = events.filter(event => event.type === "boss").length;
    const playerCount = events.filter(event => event.type === "player").length;
    const potionCount = events.filter(event => event.type === "potion").length;
    document.getElementById("stats").innerHTML = `
        <div class="stat"><strong>${boss?.found ? seconds(boss.duration) : "-"}</strong><span class="muted">Boss 战斗时长</span></div>
        <div class="stat"><strong>${bossCount}</strong><span class="muted">Boss 出招</span></div>
        <div class="stat"><strong>${playerCount}</strong><span class="muted">玩家应对</span></div>
        <div class="stat"><strong>${potionCount}</strong><span class="muted">药水 / 爆发</span></div>
    `;
}

function eventLine(event) {
    const target = event.target ? escapeHtml(event.target) : "";
    const note = event.note ? `<small>${escapeHtml(event.note)}</small>` : "";
    return `
        <div class="row">
            <div class="time">${seconds(event.time)}</div>
            <div><span class="badge ${escapeHtml(event.type)}">${typeLabel(event.type)}</span></div>
            <div class="source" title="${escapeHtml(event.source)}">${escapeHtml(event.source || "-")}</div>
            <div class="ability" title="${escapeHtml(event.ability)}">${escapeHtml(event.ability)}${note}</div>
            <div class="target" title="${target}">${target ? `-> ${target}` : ""}</div>
        </div>
    `;
}

function renderTimeline() {
    const boss = selectedBoss();
    const title = document.getElementById("bossTitle");
    const subtitle = document.getElementById("bossSubtitle");
    const holder = document.getElementById("bossTimeline");
    if (!boss) {
        title.textContent = "Boss 时间轴";
        subtitle.textContent = "当前 JSON 没有 bossTimelines。请用新版 export.py 重新导出。";
        holder.innerHTML = `<div class="empty">缺少结构化 Boss 时间轴数据。</div>`;
        renderStats(null, []);
        return;
    }

    title.textContent = boss.name;
    subtitle.textContent = boss.found
        ? `Boss 进入战斗：${seconds(boss.startDungeonTime)}（副本轴）；首个 Boss 技能：${seconds(boss.firstBossCastTime)}；窗口来源：${boss.windowSource === "fight" ? "WCL fight" : "战斗事件推断"}。`
        : boss.message;

    const events = (boss.events || []).filter(eventVisible);
    renderStats(boss, events);
    if (!boss.found || !events.length) {
        holder.innerHTML = `<div class="empty">${escapeHtml(boss.message || "当前筛选下没有事件。")}</div>`;
        return;
    }
    holder.innerHTML = `
        <div class="timeline">
            <div class="timeline-head">
                <div>时间</div><div>类型</div><div>来源</div><div>技能</div><div>目标</div>
            </div>
            ${events.map(eventLine).join("")}
        </div>
    `;
}

function renderWaves() {
    const holder = document.getElementById("waves");
    const waves = state.payload.potionWaves || [];
    if (!waves.length) {
        holder.innerHTML = `<div class="empty">没有命中药水 / 爆发波次。</div>`;
        return;
    }
    holder.innerHTML = waves.map(wave => {
        const items = (wave.events || [])
            .map(event => `${escapeHtml(event.source || "-")}：${escapeHtml(event.ability)}`)
            .join("<br>");
        return `<div class="wave"><strong>第 ${wave.index} 波 ${seconds(wave.time)}</strong><br>${items}</div>`;
    }).join("");
}

function renderPlayers() {
    const holder = document.getElementById("players");
    const players = state.payload.players || [];
    if (!players.length) {
        holder.innerHTML = `<div class="empty">当前 JSON 没有玩家信息。</div>`;
        return;
    }
    holder.innerHTML = players.map(player => `
        <div class="mini">
            <span>${escapeHtml(player.name)}</span>
            <span class="muted">${escapeHtml(player.role || "玩家")}</span>
        </div>
    `).join("");
}

function renderDungeonSummary() {
    const holder = document.getElementById("dungeonSummary");
    const counts = state.payload.rawCounts || {};
    const foundBosses = bossList().filter(boss => boss.found).length;
    holder.innerHTML = `
        <div class="mini"><span>敌对施法</span><span class="muted">${counts.enemyCasts || 0}</span></div>
        <div class="mini"><span>友方施法</span><span class="muted">${counts.friendlyCasts || 0}</span></div>
        <div class="mini"><span>关键事件</span><span class="muted">${counts.relevantEvents || 0}</span></div>
        <div class="mini"><span>命中 Boss</span><span class="muted">${foundBosses}/${bossList().length}</span></div>
    `;
}

function renderStatus() {
    const status = document.getElementById("status");
    const meta = state.payload.meta || {};
    const dungeon = state.payload.dungeon || {};
    const foundBosses = bossList().filter(boss => boss.found).length;
    status.textContent = `${dungeon.name || "大秘境"}：已读取 ${meta.exportType || "unknown"}，命中 ${foundBosses}/${bossList().length} 个 Boss 时间轴。`;
}

function render() {
    if (!state.selectedBoss && bossList().length) state.selectedBoss = bossList()[0].key;
    renderBossTabs();
    renderFilters();
    renderStatus();
    renderTimeline();
    renderWaves();
    renderPlayers();
    renderDungeonSummary();
}

document.getElementById("typeFilter").addEventListener("change", event => {
    state.typeFilter = event.target.value;
    renderTimeline();
});

document.getElementById("playerFilter").addEventListener("change", event => {
    state.playerFilter = event.target.value;
    renderTimeline();
});

fetch(DATA_URL)
    .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    })
    .then(payload => {
        state.payload = normalizeLegacy(payload);
        render();
    })
    .catch(error => {
        document.getElementById("status").textContent = `读取失败：${error.message}`;
        document.getElementById("bossTimeline").innerHTML = `<div class="empty">请确认 ${DATA_URL} 存在并且是新版结构化 JSON。</div>`;
    });
</script>
</body>
</html>
